<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#000;--sf:#1c1c1e;--sf2:#2c2c2e;--tx:#fff;--tx2:#8e8e93;--ac:#3e88f7;--sep:#38383a;--out:#e1fec6;--in:#fff;--ease:cubic-bezier(.2,.85,.25,1)}
html,body{height:100%;background:#0e0e10;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--tx);overflow:hidden}
#app{position:relative;width:100%;max-width:440px;height:100%;margin:0 auto;overflow:hidden;background:var(--bg)}
@media(min-width:600px){#app{height:min(900px,96vh);margin-top:2vh;border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.6)}}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;transition:transform .32s var(--ease),opacity .32s var(--ease)}
#chat{transform:translateX(100%);background:#7b8ad8;z-index:5;box-shadow:-10px 0 30px rgba(0,0,0,.3)}
#chat.open{transform:none}
#main.pushed{transform:translateX(-25%);opacity:.6}
/* main */
.top{padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;background:rgba(18,18,20,.96);backdrop-filter:blur(20px)}
.top-row{display:flex;align-items:center;justify-content:space-between;height:34px}
.top-row h1{font-size:17px;font-weight:600}
.link{color:var(--ac);font-size:16px;padding:4px}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--ac);transition:background .2s,transform .15s}
.iconbtn:active{transform:scale(.88);background:rgba(255,255,255,.08)}
.search{margin-top:8px;display:flex;align-items:center;gap:6px;background:var(--sf2);border-radius:10px;padding:7px 10px;color:var(--tx2)}
.search input{flex:1;font-size:16px;color:#fff}
.search input::placeholder{color:var(--tx2)}
.folders{display:flex;gap:18px;margin-top:10px;overflow-x:auto;scrollbar-width:none;position:relative;padding-bottom:6px}
.folders::-webkit-scrollbar{display:none}
.folder{font-size:15px;color:var(--tx2);white-space:nowrap;transition:color .2s;display:flex;align-items:center;gap:5px}
.folder.on{color:var(--ac);font-weight:600}
.folder .cnt{background:var(--tx2);color:#000;font-size:11px;border-radius:9px;padding:0 6px;font-weight:600;line-height:17px}
.folder.on .cnt{background:var(--ac);color:#fff}
.uline{position:absolute;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--ac);transition:left .28s var(--ease),width .28s var(--ease)}
.content{flex:1;overflow-y:auto;overscroll-behavior:contain}
.tabpane{animation:fadeIn .25s var(--ease)}
.sec-h{padding:14px 16px 6px;color:var(--tx2);font-size:13px;text-transform:uppercase;letter-spacing:.3px}
.item{display:flex;align-items:center;gap:12px;padding:8px 14px;cursor:pointer;position:relative;transition:background .15s;animation:slideIn .3s var(--ease) both}
.item:active{background:var(--sf2)}
.item .body{flex:1;min-width:0;border-bottom:.5px solid var(--sep);padding-bottom:9px;align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.item .l1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.item .nm{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.item .tm{font-size:14px;color:var(--tx2);flex-shrink:0}
.item .l2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.item .pv{color:var(--tx2);font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .pv b{color:#fff;font-weight:400}
.item .pv .typ{color:var(--ac)}
.badge{background:var(--ac);color:#fff;font-size:13px;font-weight:600;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 7px;flex-shrink:0;animation:pop .3s var(--ease)}
.badge.mute{background:#5a5a5e}
.av{flex-shrink:0;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;overflow:hidden;position:relative;background-size:cover;background-position:center}
.av img{width:100%;height:100%;object-fit:cover}
.av.on::after{content:'';position:absolute;right:1px;bottom:1px;width:22%;height:22%;border-radius:50%;background:#34c759;border:2px solid #000}
.av-wrap{position:relative;flex-shrink:0}
.av-wrap .dot{position:absolute;right:1px;bottom:1px;width:14px;height:14px;border-radius:50%;background:#34c759;border:2.5px solid #000;animation:pop .3s var(--ease)}
.tabbar{display:flex;justify-content:space-around;padding:6px 0 calc(env(safe-area-inset-bottom) + 6px);background:rgba(18,18,20,.96);border-top:.5px solid var(--sep)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--tx2);width:80px;transition:color .2s,transform .15s}
.tab.on{color:var(--ac)}
.tab:active{transform:scale(.9)}
.tab svg{width:27px;height:27px}
.empty{color:var(--tx2);text-align:center;padding:40px 20px;font-size:15px}
/* chat */
.chat-bg{position:absolute;inset:0;background:linear-gradient(160deg,#a7b4ff 0%,#9c8fe8 35%,#c59be6 70%,#8fb6f0 100%)}
.chat-bg::after{content:'';position:absolute;inset:0;opacity:.28;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M20 30l4 8 9 1-7 6 2 9-8-5-8 5 2-9-7-6 9-1z'/><path d='M120 20c-6-8-18-2-12 8l12 10 12-10c6-10-6-16-12-8z'/><circle cx='70' cy='80' r='12'/><circle cx='66' cy='77' r='1.5'/><circle cx='74' cy='77' r='1.5'/><path d='M65 85q5 4 10 0'/><path d='M140 110q10-14 20 0t20 0'/><path d='M20 120h24l-4 26H24z'/><path d='M28 120v-6M36 120v-8'/><path d='M100 140l10-18 10 18z'/><circle cx='155' cy='160' r='6'/><path d='M150 60c8 0 8 10 0 10'/><path d='M50 170l8-8 8 8-8 8z'/><path d='M90 30q8-8 16 0'/></svg>")}
.chat-head{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:rgba(250,250,252,.93);backdrop-filter:blur(20px);color:#000;border-bottom:.5px solid rgba(0,0,0,.12)}
.chat-head .back{color:var(--ac);display:flex;align-items:center;font-size:17px;gap:0;padding:4px}
.chat-head .ttl{flex:1;text-align:center;min-width:0;cursor:pointer}
.chat-head .ttl .n{font-weight:600;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .ttl .s{font-size:13px;color:#8e8e93;transition:color .2s;height:17px}
.chat-head .ttl .s.blue{color:var(--ac)}
.msgs{position:relative;z-index:1;flex:1;overflow-y:auto;padding:10px 8px 6px;display:flex;flex-direction:column;gap:3px;overscroll-behavior:contain}
.daysep{align-self:center;background:rgba(0,0,0,.22);color:#fff;font-size:13px;font-weight:500;padding:3px 10px;border-radius:12px;margin:8px 0;animation:fadeIn .3s}
.sys{align-self:center;background:rgba(0,0,0,.22);color:#fff;font-size:13px;padding:4px 12px;border-radius:12px;margin:6px 0;text-align:center;max-width:85%}
.row{display:flex;align-items:flex-end;gap:6px;max-width:100%}
.row.out{justify-content:flex-end}
.row.anim.out{animation:sendIn .34s var(--ease) both;transform-origin:100% 100%}
.row.anim.in{animation:recvIn .38s var(--ease) both;transform-origin:0 100%}
.row .mav{width:32px;height:32px;font-size:13px}
.bubble{position:relative;max-width:min(80%,330px);padding:6px 10px 7px;border-radius:18px;font-size:16px;line-height:1.3;color:#000;word-wrap:break-word;white-space:pre-wrap;transition:transform .2s var(--ease),filter .2s;user-select:none;-webkit-user-select:none;box-shadow:0 1px 1px rgba(0,0,0,.1)}
.row.in .bubble{background:var(--in);border-bottom-left-radius:6px}
.row.out .bubble{background:var(--out);border-bottom-right-radius:6px}
.bubble:active{transform:scale(.97)}
.bubble .who{font-size:14px;font-weight:600;margin-bottom:1px}
.bubble .fwd{font-size:13px;color:var(--ac);border-left:2px solid var(--ac);padding-left:6px;margin-bottom:3px}
.bubble .meta{float:right;margin:8px 0 -4px 10px;font-size:11.5px;color:#a0a0a5;display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.row.out .bubble .meta{color:#5fb24f}
.bubble.sched{opacity:.75}
.bubble.sched .meta{color:#888!important}
.bubble img.ph{display:block;max-width:100%;border-radius:12px;margin:-2px -6px 4px;width:calc(100% + 12px)}
.bubble.post{max-width:min(88%,360px)}
.bubble.post .views{color:#a0a0a5}
.stk{position:relative;font-size:96px;line-height:1.1;padding:2px 4px;user-select:none;-webkit-user-select:none;background:none!important;box-shadow:none!important}
.stk .meta{position:absolute;right:4px;bottom:2px;background:rgba(0,0,0,.3);color:#fff!important;border-radius:10px;padding:1px 7px;font-size:11.5px;display:inline-flex;gap:2px}
.stk img{width:150px;height:150px;object-fit:contain;display:block}
.bigemo{font-size:52px;line-height:1.1;background:none!important;box-shadow:none!important;padding:2px 2px 18px}
.bigemo .meta{position:absolute;right:2px;bottom:0;float:none;margin:0;background:rgba(0,0,0,.25);color:#fff!important;border-radius:10px;padding:1px 7px}
.ae{display:inline-block}
.ae.a0{animation:bounce 1.6s ease-in-out infinite}
.ae.a1{animation:wiggle 1.4s ease-in-out infinite}
.ae.a2{animation:pulse 1.2s ease-in-out infinite}
.ae.a3{animation:floaty 2.2s ease-in-out infinite}
.ae.a4{animation:spin 2.6s var(--ease) infinite}
.ae.a5{animation:jelly 1.8s ease-in-out infinite}
.noanim .ae{animation:none!important}
.reacts{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;clear:both}
.rc{display:inline-flex;align-items:center;gap:3px;background:rgba(62,136,247,.14);color:var(--ac);border-radius:14px;padding:2px 8px 2px 6px;font-size:14px;font-weight:600;animation:pop .35s var(--ease)}
.rc.mine{background:var(--ac);color:#fff}
.row.out .rc{background:rgba(95,178,79,.18);color:#3d8f2e}
.row.out .rc.mine{background:#5fb24f;color:#fff}
.stk .reacts,.bigemo .reacts{justify-content:flex-end}
/* spoiler */
.spoiler{position:relative;color:transparent!important;border-radius:5px;transition:color .18s ease;cursor:pointer}
.spoiler::after{content:'';position:absolute;inset:-1px -2px;border-radius:5px;pointer-events:none;
background-image:radial-gradient(circle,rgba(70,110,70,.85) .9px,transparent 1.3px),radial-gradient(circle,rgba(70,110,70,.6) .7px,transparent 1.1px);
background-size:4px 4px,5px 5px;background-position:0 0,2px 1px;animation:dots 1.1s linear infinite;transition:opacity .2s ease,transform .22s var(--ease),filter .22s}
.row.in .spoiler::after{background-image:radial-gradient(circle,rgba(90,90,100,.8) .9px,transparent 1.3px),radial-gradient(circle,rgba(90,90,100,.55) .7px,transparent 1.1px)}
.spoiler.rev{color:inherit!important}
.spoiler.rev::after{opacity:0;transform:scale(1.35);filter:blur(2px)}
/* input */
.inbar{position:relative;z-index:3;display:flex;align-items:flex-end;gap:6px;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);background:rgba(250,250,252,.95);backdrop-filter:blur(20px);color:#000;border-top:.5px solid rgba(0,0,0,.12)}
.inbar .ib{width:36px;height:36px;display:grid;place-items:center;color:#8e8e93;border-radius:50%;flex-shrink:0;transition:color .2s,transform .15s}
.inbar .ib:active{transform:scale(.85)}
.inbar .ib.on{color:var(--ac)}
.field{flex:1;display:flex;align-items:flex-end;background:#fff;border:.5px solid #d1d1d6;border-radius:20px;padding:0 4px 0 14px;min-height:36px}
.field textarea{flex:1;resize:none;font-size:16px;line-height:20px;padding:8px 0;max-height:120px;color:#000}
.send{width:36px;height:36px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;flex-shrink:0;transition:transform .2s var(--ease),opacity .2s,background .2s;touch-action:none}
.send.dim{opacity:.45}
.send:active{transform:scale(.86)}
.send.press{transform:scale(1.12)}
.mutebar{position:relative;z-index:3;padding:12px 0 calc(env(safe-area-inset-bottom) + 12px);text-align:center;background:rgba(250,250,252,.95);backdrop-filter:blur(20px);border-top:.5px solid rgba(0,0,0,.12)}
.mutebar button{color:var(--ac);font-size:17px;transition:transform .15s}
.mutebar button:active{transform:scale(.92)}
/* emoji panel */
.panel{position:relative;z-index:3;background:#f2f2f7;color:#000;height:0;overflow:hidden;transition:height .28s var(--ease)}
.panel.open{height:270px}
.ptabs{display:flex;gap:4px;padding:6px 8px;border-bottom:.5px solid #d1d1d6}
.ptab{padding:5px 12px;border-radius:14px;font-size:14px;color:#666;transition:background .2s,color .2s}
.ptab.on{background:#fff;color:#000;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.pgrid{height:226px;overflow-y:auto;display:grid;grid-template-columns:repeat(8,1fr);padding:6px;gap:2px;align-content:start}
.pgrid.st{grid-template-columns:repeat(4,1fr);gap:6px}
.pgrid button{font-size:28px;height:42px;border-radius:8px;transition:transform .15s,background .15s}
.pgrid button:active{transform:scale(1.3);background:#e5e5ea}
.pgrid.st button{height:78px;font-size:56px;display:grid;place-items:center}
.pgrid.st img{width:70px;height:70px;object-fit:contain}
.addstk{font-size:28px!important;color:var(--ac);border:2px dashed #c7c7cc!important}
/* popups */
.overlay{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,0);transition:background .2s,backdrop-filter .2s;pointer-events:none}
.overlay.show{background:rgba(0,0,0,.35);pointer-events:auto;backdrop-filter:blur(6px)}
.sendmenu{position:absolute;z-index:60;right:10px;background:rgba(250,250,252,.98);color:#000;border-radius:14px;min-width:270px;box-shadow:0 10px 40px rgba(0,0,0,.3);overflow:hidden;transform-origin:100% 100%;animation:menuIn .2s var(--ease)}
.sendmenu button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;font-size:16px;text-align:left;border-bottom:.5px solid #e5e5ea;transition:background .12s}
.sendmenu button:last-child{border:0}
.sendmenu button:active{background:#e5e5ea}
.sendmenu button.red{color:#ff3b30}
.sendmenu button:disabled{opacity:.35}
.sendmenu .ic{width:22px;text-align:center;font-size:18px}
.ctx{position:absolute;z-index:60;left:0;right:0;display:flex;flex-direction:column;gap:8px;padding:0 10px;pointer-events:none}
.ctx>*{pointer-events:auto}
.rbar{align-self:flex-start;display:flex;gap:2px;background:#fff;border-radius:26px;padding:5px 8px;box-shadow:0 6px 24px rgba(0,0,0,.25);animation:menuIn .22s var(--ease);transform-origin:20% 100%}
.rbar button{font-size:28px;width:40px;height:40px;border-radius:50%;transition:transform .15s}
.rbar button:hover{transform:scale(1.2)}
.rbar button:active{transform:scale(1.4)}
.rbar button span{display:inline-block;animation:pop .35s var(--ease) both}
.ctxmenu{align-self:flex-start;background:rgba(250,250,252,.98);color:#000;border-radius:14px;min-width:220px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.25);animation:menuIn .22s var(--ease);transform-origin:20% 0}
.ctxmenu button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:11px 16px;font-size:16px;border-bottom:.5px solid #e5e5ea}
.ctxmenu button:last-child{border:0}
.ctxmenu button:active{background:#e5e5ea}
.ctxmenu .red{color:#ff3b30}
.ctx.out .rbar,.ctx.out .ctxmenu{align-self:flex-end}
.ctxclone{pointer-events:none!important;align-self:flex-start;animation:liftUp .22s var(--ease)}
.ctx.out .ctxclone{align-self:flex-end}
.plusmenu{position:absolute;z-index:60;top:calc(env(safe-area-inset-top) + 48px);right:10px;background:var(--sf);border-radius:14px;min-width:230px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.6);transform-origin:100% 0;animation:menuIn .2s var(--ease)}
.plusmenu button{display:flex;align-items:center;gap:14px;width:100%;padding:13px 16px;font-size:16px;border-bottom:.5px solid var(--sep);text-align:left}
.plusmenu button:last-child{border:0}
.plusmenu button:active{background:var(--sf2)}
.plusmenu svg{color:var(--ac)}
.sheet{position:absolute;z-index:70;left:0;right:0;bottom:0;max-height:92%;background:var(--sf);border-radius:16px 16px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s var(--ease)}
.sheet.show{transform:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:.5px solid var(--sep)}
.sheet-h h3{font-size:17px;font-weight:600}
.sheet-b{overflow-y:auto;padding:16px}
.fld{display:block;background:var(--sf2);border-radius:12px;padding:12px 14px;margin-bottom:10px;width:100%;font-size:16px;color:#fff}
.fld::placeholder{color:var(--tx2)}
textarea.fld{resize:none;height:80px}
.hint{color:var(--tx2);font-size:13px;margin:-4px 4px 12px}
.avpick{width:96px;height:96px;margin:0 auto 16px;border-radius:50%;background:var(--sf2);display:grid;place-items:center;color:var(--ac);cursor:pointer;overflow:hidden;transition:transform .15s}
.avpick:active{transform:scale(.94)}
.avpick img{width:100%;height:100%;object-fit:cover}
.chk{display:flex;align-items:center;gap:12px;padding:8px 0;cursor:pointer}
.chk .box{width:22px;height:22px;border-radius:50%;border:2px solid var(--tx2);margin-left:auto;transition:all .2s;display:grid;place-items:center}
.chk.on .box{background:var(--ac);border-color:var(--ac)}
.chk.on .box::after{content:'✓';color:#fff;font-size:13px;font-weight:700}
.btn{display:block;width:100%;background:var(--ac);color:#fff;font-weight:600;font-size:16px;padding:14px;border-radius:12px;margin-top:6px;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--sf2);color:var(--ac)}
.light .sheet{background:#f2f2f7;color:#000}
.toast{position:absolute;z-index:90;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translate(-50%,-20px);background:rgba(40,40,44,.92);color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;transition:all .28s var(--ease);pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.similar{position:absolute;z-index:40;left:8px;right:8px;bottom:70px;background:#fff;color:#000;border-radius:18px;padding:12px 4px 12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:menuIn .3s var(--ease);transform-origin:50% 100%}
.similar h4{font-size:17px;margin-bottom:10px;display:flex;justify-content:space-between;padding-right:10px}
.similar .x{color:#8e8e93;font-size:20px;line-height:1}
.simlist{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.simlist::-webkit-scrollbar{display:none}

<script>
(function(){
const $=s=>document.querySelector(s);
const now=()=>Date.now();
const REAL=!!window.__REAL;
const MIN=60e3,HOUR=3600e3,DAY=86400e3;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const COLORS=['#e17076','#7bc862','#a695e7','#ee7aae','#6ec9cb','#faa774','#65aadd','#e5a64e'];
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1==1)return a;return c};
const hhmm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const dmy=t=>{const d=new Date(t);return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear()};
const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const dayLabel=t=>{const d=new Date(t),n=new Date();if(d.toDateString()===n.toDateString())return 'Сегодня';const y=new Date(n-DAY);if(d.toDateString()===y.toDateString())return 'Вчера';return d.getDate()+' '+MONTHS[d.getMonth()]+(d.getFullYear()!==n.getFullYear()?' '+d.getFullYear():'')};
const listTime=t=>{const d=new Date(t),n=new Date();if(d.toDateString()===n.toDateString())return hhmm(t);if(n-d<6*DAY)return ['вс','пн','вт','ср','чт','пт','сб'][d.getDay()];return dmy(t).slice(0,5)};
const fmtK=n=>n>=1000?(n/1000).toFixed(1).replace('.0','')+'K':String(n);

/* ---------- state ---------- */
const KEY='msgr_clean_v1';const DEMO=false;
let S=null;
try{S=JSON.parse(localStorage.getItem(REAL?'msgr_real_v1':KEY)||'null')}catch(e){}
if(!S||!S.v)S=seed();
const save=()=>{try{localStorage.setItem(REAL?'msgr_real_v1':KEY,JSON.stringify(S))}catch(e){try{toast('Память браузера заполнена — удалите старые голосовые')}catch(_){}}};
if(REAL){delete S.chats.p_anna;delete S.users.anna}
if(!REAL&&!S.annaSeed){S.annaSeed=1;S.users.anna={name:'Анна',g:'f',color:'#e17076',phone:'+381 60 555 01 02',online:false,lastSeen:null,contact:true};S.chats.p_anna={id:'p_anna',type:'private',user:'anna',messages:[{id:uid(),from:'anna',text:'Привет! Это тестовый чат — запиши мне голосовое 🎙',time:Date.now()-60e3,status:'read',reactions:{}}],unread:1};save()}
const T={typing:{},openChat:null,tab:'chats',folder:'all',q:'',animated:new Set(),spoilerSend:false,panelTab:'emoji',revealed:new Set()};

function seed(){
  const t=now();
  const users={};
  const chats={};
  return {v:1,me:{name:'Андрей',username:'',bio:'',phone:'+381 60 000 00 00',avatar:null,color:'#3e88f7'},users,chats,stickers:[],animEmoji:true};
}

/* ---------- helpers ---------- */
function chatTitle(c){return c.type==='private'?S.users[c.user].name:c.title}
function chatAvatarObj(c){if(c.type==='private'){const u=S.users[c.user];return {name:u.name,color:u.color,emoji:u.emoji,img:u.avatar}}return {name:c.title,color:c.color,emoji:c.emoji,img:c.avatar}}
function avHTML(o,size,cls){
  const st=`width:${size}px;height:${size}px;font-size:${Math.round(size*.4)}px;background:${o.img?'#333':`linear-gradient(180deg,${lighten(o.color||'#888')},${o.color||'#888'})`}`;
  let inner;
  if(o.img)inner=`<img src="${o.img}" alt="">`;
  else if(o.emoji)inner=`<span style="font-size:${Math.round(size*.55)}px">${o.emoji}</span>`;
  else inner=esc(initials(o.name));
  return `<div class="av ${cls||''}" style="${st}">${inner}</div>`;
}
function lighten(hex){const n=parseInt(hex.slice(1),16);let r=(n>>16)+40,g=((n>>8)&255)+40,b=(n&255)+40;r=Math.min(255,r);g=Math.min(255,g);b=Math.min(255,b);return `rgb(${r},${g},${b})`}
function initials(n){const p=String(n||'?').trim().split(/\s+/);return ((p[0]||'?')[0]+((p[1]||'')[0]||'')).toUpperCase()}
function statusText(u){
  if(u.online)return 'в сети';
  if(!u.lastSeen)return 'не в сети';
  const s=u.g==='f'?'была':'был';const d=now()-u.lastSeen;
  if(d<MIN)return s+' недавно';
  if(d<HOUR){const m=Math.floor(d/MIN);return `${s} ${m} ${plural(m,'минуту','минуты','минут')} назад`}
  if(d<15*HOUR){const h=Math.floor(d/HOUR);return `${s} ${h} ${plural(h,'час','часа','часов')} назад`}
  if(d<30*DAY)return s+' очень давно';
  return s+' '+dmy(u.lastSeen);
}
function lastMsg(c){const a=c.messages.filter(m=>m.status!=='scheduled');return a[a.length-1]}
function iWrote(c){return c.messages.some(m=>m.from==='me')}
function visibleInList(c){
  if(c.remote)return c.type==='group'||c.messages.some(m=>!m.sys)||(c.pending&&c.pending.length>0);
  if(c.type==='channel')return c.subscribed||c.owner;
  if(c.type==='group')return !c.discussion||!!c.joined;
  if(!c.messages.length)return false;
  return S.users[c.user].contact||iWrote(c)||c.archived;
}
function previewText(m){if(!m)return '';if(m.title)return m.title;if(m.poll)return '📊 '+m.poll.q;if(m.voice)return '🎤 Голосовое сообщение · '+fmtDur(m.voice.dur||0);if(m.call)return (m.call.video?'🎥 ':'📞 ')+(m.call.res==='ok'?'Звонок'+(m.call.dur?' · '+fmtDur(m.call.dur):''):m.call.res==='missed'?'Пропущенный звонок':'Отменённый звонок');if(m.sticker)return 'Стикер';if(m.img)return '🖼 Фото';if(m.spoiler)return '▒▒▒▒▒▒';return m.text}
function isEmojiOnly(t){if(!t)return false;const s=t.replace(/\s/g,'');if(!s||s.length>16)return false;if(!/^(\p{Extended_Pictographic}|\p{Emoji_Component}|‍|️)+$/u.test(s))return false;if(/^[0-9#*]+$/.test(s))return false;const segs=[...new Intl.Segmenter?new Intl.Segmenter().segment(s):s].length;return segs<=3}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1600)}
const animCls=s=>'a'+([...String(s)].reduce((a,c)=>a+c.codePointAt(0),0)%6);

const IC={
  tabCalls:'<svg viewBox="0 0 28 28" fill="currentColor"><path d="M8.3 12.6a17.6 17.6 0 0 0 7.6 7.6l2.5-2.5c.3-.3.8-.4 1.2-.3 1.3.4 2.7.7 4.1.7.6 0 1.1.5 1.1 1.1v4c0 .6-.5 1.1-1.1 1.1A19.6 19.6 0 0 1 4.1 4.6c0-.6.5-1.1 1.1-1.1h4c.6 0 1.1.5 1.1 1.1 0 1.4.2 2.8.7 4.1.1.4 0 .8-.3 1.2z"/></svg>',
  phone:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>',
  video:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="13" height="12" rx="2.5"/><path d="M15.5 10.5 21 7.5v9l-5.5-3"/></svg>',
  dots:'<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',

/* ---------- main screen ---------- */
function renderTabbar(){
  const tabs=[['contacts','Контакты',IC.tabContacts],['calls','Звонки',IC.tabCalls],['chats','Чаты',IC.tabChats],['settings','Настройки',IC.tabSettings]];
  const unread=Object.values(S.chats).filter(c=>visibleInList(c)&&!c.muted&&!c.locked).reduce((a,c)=>a+(c.unread||0),0);
  const missed=S.missedNew||0;
  const bar=$('#tabbar');
  const sig=tabs.map(t=>t[0]).join()+T.tab+unread+'/'+missed;
  if(bar._sig===sig)return;bar._sig=sig;
  bar.innerHTML=tabs.map(([k,l,i])=>{const n=k==='chats'?unread:k==='calls'?missed:0;return `<button class="tab ${T.tab===k?'on':''}" data-t="${k}" style="position:relative">${i}<span>${l}</span>${n?`<span class="badge" style="position:absolute;top:-2px;left:44px;min-width:19px;height:19px;font-size:12px;${k==='calls'?'background:#ff3b30':''}">${n}</span>`:''}</button>`}).join('');
  bar.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
    if(T.tab===b.dataset.t&&!T.archive)return;
    T.tab=b.dataset.t;T.q='';T.archive=false;if(T.tab==='calls'){S.missedNew=0;save()}
    renderMain();
    const sv=bar.querySelector(`.tab[data-t="${T.tab}"] svg`);sv&&sv.animate([{transform:'scale(.6)'},{transform:'scale(1.18)',offset:.6},{transform:'none'}],{duration:420,easing:'cubic-bezier(.34,1.5,.64,1)'});
  });
}
function renderMain(){
  renderTabbar();
  const top=$('#mainTop'),ct=$('#mainContent');
  if(T.tab==='chats'&&T.archive){
    top.innerHTML=`<div class="top-row"><button class="link arback" id="arBack">${IC.back}<span>Чаты</span></button><h1>Архив</h1><span style="width:70px"></span></div>`;
    $('#arBack').onclick=()=>{T.archive=false;renderMain();ct.firstElementChild?.animate([{transform:'translateY(-30px)',opacity:0},{transform:'none',opacity:1}],{duration:420,easing:'cubic-bezier(.32,.72,0,1)'})};

    <label class="search">${IC.search}<input id="q" placeholder="Поиск по сообщениям и людям" value="${esc(T.q)}" autocomplete="off"></label>
    <div class="folders" id="folders"></div>`;
    $('#plusBtn').onclick=openPlusMenu;
    $('#editBtn').onclick=()=>toast('Зажмите чат — меню. Потяните список вниз — архив');
    const q=$('#q');q.oninput=()=>{T.q=q.value;renderChatList()};
    renderFolders();renderChatList();
  }else if(T.tab==='contacts'){
    top.innerHTML=`<div class="top-row"><span style="width:40px"></span><h1>Контакты</h1><button class="iconbtn" id="addC">${IC.plus}</button></div>
    <label class="search">${IC.search}<input id="q" placeholder="Поиск" value="${esc(T.q)}" autocomplete="off"></label>`;
    $('#addC').onclick=()=>openNewContact();
    const q=$('#q');q.oninput=()=>{T.q=q.value;renderContacts()};
    renderContacts();
  }else if(T.tab==='calls')renderCalls();

}
function renderFolders(){
  const F=[['all','Все чаты'],['private','Личные'],['group','Группы'],['channel','Каналы']];
  if(!F.some(f=>f[0]===T.folder))T.folder='all';
  const cnt=k=>Object.values(S.chats).filter(c=>visibleInList(c)&&inFolder(c,k)&&c.unread&&!c.muted).length;
  const el=$('#folders');if(!el)return;
  el.innerHTML=F.map(([k,l])=>{const n=cnt(k);return `<button class="folder ${T.folder===k?'on':''}" data-f="${k}">${l}${n?`<span class="cnt">${n}</span>`:''}</button>`}).join('')+'<div class="uline" id="uline"></div>';
  const place=()=>{const on=el.querySelector('.folder.on'),u=$('#uline');if(on&&u){u.style.left=on.offsetLeft+'px';u.style.width=on.offsetWidth+'px'}};
  requestAnimationFrame(place);
  el.querySelectorAll('.folder').forEach(b=>b.onclick=()=>{const prevIdx=F.findIndex(f=>f[0]===T.folder);T.folder=b.dataset.f;el.querySelectorAll('.folder').forEach(x=>x.classList.toggle('on',x===b));place();renderChatList();
    const dir=F.findIndex(f=>f[0]===T.folder)>prevIdx?1:-1;$('#listwrap')?.animate([{transform:`translateX(${dir*40}px)`,opacity:0},{transform:'none',opacity:1}],{duration:340,easing:'cubic-bezier(.32,.72,0,1)'})});
}
function inFolder(c,k){if(c.archived||c.locked)return false;if(k==='all')return true;return c.type===k}
function chatItemHTML(c,i){
  const o=chatAvatarObj(c);const lm=lastMsg(c);

  else if(lm){const pre=lm.sys?'':(lm.from==='me'&&c.type!=='channel'?'<b>Вы: </b>':(c.type==='group'&&lm.from!=='me'?`<b>${esc(S.users[lm.from]?.name.split(' ')[0]||'')}: </b>`:''));pv=pre+esc(previewText(lm))}
  const ticks=!c.locked&&lm&&lm.from==='me'&&c.type!=='channel'&&!lm.call?`<span style="color:var(--ac)">${lm.status==='read'?IC.check2:IC.check}</span>`:'';
  const badge=c.unread?`<span class="badge ${c.muted?'mute':''}">${c.unread}</span>`:(c.pinned?`<span class="pinic">📌</span>`:'');
  const icon=c.type==='channel'?'📢 ':c.type==='group'?'👥 ':'';
  return `<div class="item ${c.locked?'locked':''}" data-c="${c.id}" style="animation-delay:${Math.min(i,10)*25}ms"><div class="av-wrap">${avHTML(o,58)}${online?'<span class="dot"></span>':''}${c.locked?'<span class="lockb">🔒</span>':''}</div>
  <div class="body"><div class="l1"><span class="nm">${icon?`<span style="font-size:13px">${icon}</span>`:''}${esc(chatTitle(c))}${u&&u.blocked?' <span class="blk">🚫</span>':''}${c.muted?IC.mute:''}</span><span class="tm">${ticks} ${lm?listTime(lm.time):''}</span></div>
  <div class="l2"><span class="pv">${pv}</span>${badge}</div></div></div>`;
}
function renderChatList(quiet){
  const ct=$('#mainContent');
  const prev=new Map();if(quiet)ct.querySelectorAll('.item[data-c]').forEach(e=>prev.set(e.dataset.c,e.getBoundingClientRect().top));
  const q=T.q.trim().toLowerCase();
  let html='';
  if(q){
    const mine=Object.values(S.chats).filter(c=>visibleInList(c)&&!c.locked&&chatTitle(c).toLowerCase().includes(q));
    const msgHits=[];Object.values(S.chats).filter(c=>visibleInList(c)&&!c.locked).forEach(c=>c.messages.forEach(m=>{if(!m.sys&&!m.spoiler&&m.text&&m.text.toLowerCase().includes(q))msgHits.push([c,m])}));
    const gUsers=Object.entries(S.users).filter(([id,u])=>!u.bot&&!S.chats['p_'+id]?.locked&&!mine.some(c=>c.user===id)&&(u.name.toLowerCase().includes(q)||(u.username||'').toLowerCase().includes(q)));
    const gCh=Object.values(S.chats).filter(c=>c.type==='channel'&&!visibleInList(c)&&(c.title.toLowerCase().includes(q)));
    if(mine.length)html+='<div class="sec-h">Чаты и контакты</div>'+mine.map(chatItemHTML).join('');
    if(gUsers.length||gCh.length){html+='<div class="sec-h">Глобальный поиск</div>';
      html+=gUsers.map(([id,u],i)=>`<div class="item" data-u="${id}" style="animation-delay:${i*25}ms"><div class="av-wrap">${avHTML({name:u.name,color:u.color,emoji:u.emoji,img:u.avatar},46)}${u.online?'<span class="dot"></span>':''}</div><div class="body"><div class="nm">${esc(u.name)}</div><div class="pv">${u.username?'@'+esc(u.username)+', ':''}${statusText(u)}</div></div></div>`).join('');
      html+=gCh.map((c,i)=>`<div class="item" data-c="${c.id}" style="animation-delay:${i*25}ms">${avHTML(chatAvatarObj(c),46)}<div class="body"><div class="nm">📢 ${esc(c.title)}</div><div class="pv">${fmtK(c.subs)} подписчиков</div></div></div>`).join('')}
    if(msgHits.length)html+='<div class="sec-h">Сообщения</div>'+msgHits.slice(0,20).map(([c,m])=>`<div class="item" data-c="${c.id}">${avHTML(chatAvatarObj(c),46)}<div class="body"><div class="l1"><span class="nm">${esc(chatTitle(c))}</span><span class="tm">${listTime(m.time)}</span></div><div class="pv">${esc(m.text)}</div></div></div>`).join('');
    if(REAL&&RT.uid&&q.replace('@','').length>=3){if(RT.searchQ!==q){RT.searchQ=q;RT.searchHit=null;clearTimeout(RT.st);RT.st=setTimeout(async()=>{const u=await findByUsername(q);if(RT.searchQ===q&&u){RT.searchHit=u;renderChatList()}},450)}
      if(RT.searchHit){const u=RT.searchHit;html='<div class="sec-h">Найден по @нику</div><div class="item" data-ru="'+u.id+'">'+avHTML({name:u.name,color:colorFor(u.id),img:u.avatar},46)+'<div class="body"><div class="nm">'+esc(u.name)+'</div><div class="pv">@'+esc(u.username)+' · написать</div></div></div>'+html}}
    if(!html)html='<div class="empty">'+(REAL?'Ничего не найдено. Чтобы найти человека, введите его @ник':'Ничего не найдено')+'</div>';
    ct.innerHTML=`<div class="tabpane">${html}</div>`;
  }else{
    const list=Object.values(S.chats).filter(c=>visibleInList(c)&&inFolder(c,T.folder)).sort(sortChats);
    html=list.length?list.map(chatItemHTML).join(''):`<div class="onb"><div class="onb-ic">💬</div><b>Здесь пока пусто</b><p>Нажмите ✏️ справа вверху, чтобы добавить контакт, создать группу или свой канал.</p><button class="btn" id="onbGo">Начать</button></div>`;
    ct.innerHTML=`<div class="tabpane"><div class="pullzone" id="pullZone"><div class="pullring">${PULL_SVG}</div><div class="pulltxt">Потяните вниз — архив</div></div><div class="listwrap" id="listwrap">${html}</div></div>`;
  }

function ensurePrivate(id){const cid='p_'+id;if(!S.chats[cid])S.chats[cid]={id:cid,type:'private',user:id,messages:[]};return cid}
function chatListMenu(cid,el){
  const c=S.chats[cid];if(!c||!visibleInList(c)&&!c.locked)return;
  const u=c.type==='private'?S.users[c.user]:null;
  showOverlay();
  const pk=document.createElement('div');pk.className='peek';
  const last=c.messages.filter(m=>!m.sys&&m.status!=='scheduled').slice(-4);

  const items=[
    ['pin',c.pinned?'📌 Открепить':'📌 Закрепить'],

    ['del',c.type==='channel'&&!c.owner?'🚪 Покинуть канал':c.type==='group'&&!c.admin?'🚪 Покинуть группу':'🗑 Удалить чат','red']];

  $('#app').appendChild(pk);

    if(a==='arch'){c.archived=!c.archived;save();toast(c.archived?'Чат в архиве — потяните список вниз':'Чат возвращён');setTimeout(()=>removeItemAnim(cid,()=>renderMain()),150)}

function showOverlay(cb){const o=$('#overlay');o.classList.add('show');o.onclick=()=>{closePopups();cb&&cb()}}
function closePopups(){$('#overlay').classList.remove('show');document.querySelectorAll('.plusmenu,.sendmenu,.ctx,.peek').forEach(e=>{e.style.transition='opacity .15s,transform .15s';e.style.opacity=0;e.style.transform='scale(.9)';setTimeout(()=>e.remove(),150)});document.querySelectorAll('.sheet,.asheet').forEach(s=>{s.classList.remove('show');setTimeout(()=>s.remove(),420)})}
function openSheet(title,body,init,light){
  closePopups();
  setTimeout(()=>{
    showOverlay();
    const sh=document.createElement('div');sh.className='sheet';if(light)sh.style.cssText='background:#f2f2f7;color:#000';
    sh.innerHTML=`<div class="sheet-h"><button class="link" data-x>Отмена</button><h3>${title}</h3><span style="width:60px"></span></div><div class="sheet-b">${body}</div>`;
    $('#app').appendChild(sh);requestAnimationFrame(()=>requestAnimationFrame(()=>sh.classList.add('show')));
    sh.querySelector('[data-x]').onclick=closePopups;
    init&&init(sh);
  },document.querySelector('.sheet,.asheet,.plusmenu,.sendmenu,.ctx,.peek')?190:0);
}
function pickImage(cb,max){
  const f=$('#filePick');f.value='';
  f.onchange=()=>{const file=f.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const M=max||512;const k=Math.min(1,M/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=img.width*k;cv.height=img.height*k;cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);cb(cv.toDataURL(max?'image/png':'image/jpeg',.85))};img.src=r.result};r.readAsDataURL(file)};
  f.click();
}

/* ---------- chat ---------- */
function openChat(cid){
  const c=S.chats[cid];if(!c)return;
  if(c.locked&&T.unlocked!==cid){openPasscode({mode:'check',title:'Закрытый чат',sub:'Введите код-пароль',onOk:()=>{T.unlocked=cid;openChat(cid)}});return}
  closePopups();
  T.openChat=cid;T.reply=null;T.newBelow=0;c.unread=0;T.animated=new Set(c.messages.map(m=>m.id));
  if(c.type==='private'&&S.users[c.user].online)markRead(c);
  if(c.remote)markRemoteRead(c);
  save();
  renderChatHead();renderChatBottom();$('#msgs').innerHTML='';renderMessages(true);updateJump();
  $('#panel').classList.remove('open');
  $('#chat').classList.add('open');$('#main').classList.add('pushed');
  document.querySelectorAll('.similar,.subbanner').forEach(e=>e.remove());
}
function closeChat(){
  const c=S.chats[T.openChat];
  if(c&&!c.remote&&c.type==='private'&&!c.messages.length&&!c.locked)delete S.chats[c.id];
  if(c&&c.locked)T.unlocked=null;
  T.openChat=null;T.reply=null;$('#chat').classList.remove('open');$('#main').classList.remove('pushed');
  document.querySelectorAll('.similar,.subbanner').forEach(e=>e.remove());
  save();renderMain();
}
function headStatus(c){
  const ty=T.typing[c.id];
  if(ty)return {t:`${c.type==='group'?esc(S.users[ty].name.split(' ')[0])+' ':''}печатает<span class="tdots"><span>.</span><span>.</span><span>.</span></span>`,blue:true};
  if(c.type==='private'){const u=S.users[c.user];if(u.blocked)return {t:'заблокирован(а)'};return {t:statusText(u),blue:u.online}}
  if(c.type==='group'){const on=c.members.filter(m=>S.users[m]?.online).length;return {t:`${c.members.length+1} ${plural(c.members.length+1,'участник','участника','участников')}${on?`, ${on} в сети`:''}`}}
  return {t:`${fmtK(c.subs)} ${plural(c.subs,'подписчик','подписчика','подписчиков')}`};
}

  const c=S.chats[T.openChat];if(!c)return;
  const st=headStatus(c);
  const other=Object.values(S.chats).filter(x=>x.id!==c.id&&!x.locked&&!x.muted&&visibleInList(x)).reduce((a,x)=>a+(x.unread||0),0);

function sendMessage(o,when){
  const c=S.chats[T.openChat];if(!c)return;
  if(c.remote){remoteSend(c,o,when);return}
  const m={id:uid(),from:'me',text:o.text||'',time:now(),status:'sent',reactions:{}};
  if(o.spoiler)m.spoiler=true;if(o.img)m.img=o.img;if(o.voice)m.voice=o.voice;if(o.poll)m.poll=o.poll;if(o.sticker)m.sticker=o.sticker;if(o.fwd)m.fwd=o.fwd;
  if(T.reply){m.reply=T.reply;clearReply()}
  if(c.type==='channel'){m.from=c.id;m.views=1}
  if(typeof when==='number'){m.status='scheduled';m.schedAt=when}
  else if(when==='online'){m.status='waiting'}
  c.messages.push(m);T.justSent=m.id;save();renderMessages();

function afterSent(c){

    const sx=Math.min(DW-1,Math.round((xx+step/2)*d)),sy=Math.min(Math.round(H*d)-1,Math.round((yy+step/2)*d));
    const i=(sy*DW+sx)*4,a=data[i+3];if(a<28)continue;

    FX.parts.push({x:ox+xx,y:oy+yy,c:`rgb(${data[i]},${data[i+1]},${data[i+2]})`,a:a/255,s:step*.92,
      t:-(delay+(xx/W)*SW+j),j,vx:(Math.random()-.5)*50,vy:-(25+Math.random()*95),ay:-(140+Math.random()*160),
      l:.7+Math.random()*.6,w:Math.random()*6.28,f:3+Math.random()*5});
  }
  FX.layers.push({cv,ox,oy,W,H,t:-delay,SW});
  el.style.visibility='hidden';
  if(!FX.run){FX.run=true;FX.last=performance.now();requestAnimationFrame(fxLoop)}

}
function fxLoop(t){
  const dt=Math.min(.05,(t-FX.last)/1000);FX.last=t;
  const g=FX.ctx,d=FX.dpr;g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,FX.cv.width,FX.cv.height);g.setTransform(d,0,0,d,0,0);

  for(let k=FX.layers.length-1;k>=0;k--){const L=FX.layers[k];L.t+=dt;const p=L.t/L.SW;
    if(p>=1){FX.layers.splice(k,1);continue}
    const sx=Math.max(0,p)*L.W;g.globalAlpha=1;
    if(L.W-sx>0)g.drawImage(L.cv,sx*d,0,(L.W-sx)*d,L.H*d,L.ox+sx,L.oy,L.W-sx,L.H)}
  const P=FX.parts;
  for(let i=P.length-1;i>=0;i--){const q=P[i];q.t+=dt;
    if(q.t<0){if(q.t>-q.j){g.globalAlpha=q.a;g.fillStyle=q.c;g.fillRect(q.x,q.y,q.s,q.s)}continue}
    const age=q.t/q.l;if(age>=1){P[i]=P[P.length-1];P.pop();continue}
    q.vy+=q.ay*dt;q.vx*=.985;q.x+=(q.vx+Math.sin(q.w+q.t*q.f)*14)*dt;q.y+=q.vy*dt;
    const s=q.s*(1-age*.55);g.globalAlpha=q.a*Math.pow(1-age,1.4);g.fillStyle=q.c;g.fillRect(q.x,q.y,s,s)}
  g.globalAlpha=1;
  if(P.length||FX.layers.length)requestAnimationFrame(fxLoop);else{FX.run=false;g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,FX.cv.width,FX.cv.height)}
}

function longPress(el,onLong,onClick,isSend){
  let t,fired=false,sx=0,sy=0;
  el.addEventListener('pointerdown',e=>{if(e.button===2)return;fired=false;sx=e.clientX;sy=e.clientY;clearTimeout(t);t=setTimeout(()=>{fired=true;if(navigator.vibrate)try{navigator.vibrate(12)}catch(_){}onLong(e)},isSend?380:430)});
  el.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8)clearTimeout(t)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>clearTimeout(t)));
  el.addEventListener('click',e=>{if(fired){e.preventDefault();e.stopPropagation();fired=false;return}onClick&&onClick(e)});
  el.addEventListener('contextmenu',e=>{e.preventDefault();if(!fired){fired=true;clearTimeout(t);onLong(e);setTimeout(()=>fired=false,300)}});
}

let SAMPLER=null,SAMPLER_TRIED=false,SAMPLER_OFF=false;
function getSampler(){
  if(SAMPLER_TRIED)return Promise.resolve(SAMPLER);SAMPLER_TRIED=true;
  try{if(!window.claude||!window.claude.use)return Promise.resolve(null);
    return Promise.race([window.claude.use('sample'),new Promise(r=>setTimeout(()=>r(null),4000))]).then(s=>{SAMPLER=s||null;return SAMPLER}).catch(()=>null)}catch(_){return Promise.resolve(null)}
}
async function smartReply(c,botU,userText){
  const k=c.discussion,F=FEEDS[k],b=S.users[botU];
  const fallback=()=>ruleReply(k,userText);
  if(SAMPLER_OFF)return fallback();
  const sp=await getSampler();if(!sp)return fallback();
  const hist=c.messages.filter(m=>!m.sys&&m.text).slice(-10).map(m=>(m.from==='me'?S.me.name:(S.users[m.from]?.name||'?'))+': '+m.text).join('\n');
  const persona={fan:'восторженный фанат',kind:'добрый и дружелюбный',expert:'знаток, любит факты',joker:'шутник',skeptic:'любит поспорить, но вежливо'}[b.style]||'фанат';
  const prompt=`Ты — ${b.name}, бот-фанат в чате канала «${F.title}» в мессенджере. Характер: ${persona}.
Правила: отвечай по-русски, 1–2 коротких живых предложения, можно 1–2 эмодзи. Отвечай именно на сообщение собеседника. Если спросят, бот ли ты — честно скажи, что да. Не выдумывай факты, даты и серии: если не уверен, так и скажи. Будь добрым и подходящим для детей: без грубости, страшилок и взрослых тем, не проси личные данные и не назначай встречи. Не пересказывай сюжет дословно и не цитируй тексты песен.
Проверенные факты, на которые можно опираться:
${F.facts.map(f=>'- '+f).join('\n')}
Персонажи: ${F.chars.join(', ')}.
Последние сообщения чата:
${hist}
Ответь на последнее сообщение от ${S.me.name}: «${userText}». Выведи только текст ответа.`;
  try{const r=await sp(prompt,{modelTier:'default',cache:false});const t=(r&&r.text||'').trim().replace(/^["«]|["»]$/g,'');return t&&t.length<400?t:fallback()}
  catch(e){if(e&&(e.code==='not_granted'||e.code==='rate_limited'))SAMPLER_OFF=e.code==='not_granted';return fallback()}
}
function discussionRespond(c,m){
  if(c._botBusy){setTimeout(()=>discussionRespond(c,m),1500);return}c._botBusy=true;
  const ids=c.members;const first=pick(ids);
  setTimeout(()=>{
    T.typing[c.id]=first;updateTyping(c);
    const t0=performance.now();
    smartReply(c,first,m.text||'').then(txt=>{
      const wait=Math.max(0,900+Math.min(2400,txt.length*35)-(performance.now()-t0));
      setTimeout(()=>{
        delete T.typing[c.id];
        c.messages.push({id:uid(),from:first,text:gz(txt,first),time:now(),status:'read',reactions:{},reply:{id:m.id,name:S.me.name,text:previewText(m)}});

          setTimeout(()=>{T.typing[c.id]=second;updateTyping(c);setTimeout(()=>{delete T.typing[c.id];const {A,B}=namesFor(c.discussion);
            c.messages.push({id:uid(),from:second,text:gz(fill(pick(BANTER.re),{A,B}),second),time:now(),status:'read',reactions:{}});save();updateTyping(c)},1300+Math.random()*1200)},800)}

      },wait);
    });

}

/* ---------- start / stop ---------- */
function startRemote(){

  F.onAuthStateChanged(F.auth,async u=>{

      if(!snap.exists()||!snap.data().username){showProfileSetup(u,snap.exists()?snap.data():null);return}

    Object.values(S.chats).forEach(c=>{if(c.remote&&!seen.has(c.rid)){RT.msgUnsubs[c.rid]&&RT.msgUnsubs[c.rid]();delete RT.msgUnsubs[c.rid];if(T.openChat===c.id)closeChat();delete S.chats[c.id]}});

/* ---------- chats ---------- */
function applyChatDoc(id,d){
  const L='r_'+id;const c=S.chats[L]||(S.chats[L]={id:L,remote:true,rid:id,messages:[],pending:[]});
  c.remote=true;c.rid=id;c.type=d.type==='group'?'group':'private';c.pending=c.pending||[];
  if(c.type==='private'){const other=(d.members||[]).find(x=>x!==RT.uid)||RT.uid;c.user=other;watchUser(other)}
  else{c.title=d.title||'Группа';c.color=d.color||'#65aadd';c.avatar=d.avatar||null;c.emoji=null;c.members=(d.members||[]).filter(x=>x!==RT.uid);c.admin=(d.admins||[]).includes(RT.uid);c.admins=d.admins||[];c.members.forEach(watchUser)}
  c.reads=d.reads||{};c.lastTime=d.updatedAt||0;
  const tp=d.typing||{};let ty=null;Object.entries(tp).forEach(([u,t])=>{if(u!==RT.uid&&Date.now()-t<6000)ty=u});
  if(ty){T.typing[L]=ty;clearTimeout(c._tyT);c._tyT=setTimeout(()=>{if(T.typing[L]===ty){delete T.typing[L];updateTyping(c)}},6000)}else delete T.typing[L];
  if(T.openChat===L)updateHeadStatus();
  if(!RT.msgUnsubs[id])watchMessages(c);else recomputeStatus(c);
}
function mapMsg(c,doc){
  const d=doc.data();const prev=c.messages.find(x=>x.id===doc.id);
  const m={id:doc.id,from:d.from===RT.uid?'me':d.from,text:d.text||'',time:d.time||Date.now(),status:'sent',reactions:{}};
  if(d.sys)m.sys=true;if(d.spoiler)m.spoiler=true;if(d.img)m.img=d.img;if(d.sticker)m.sticker=d.sticker;if(d.fwd)m.fwd=d.fwd;if(d.reply)m.reply=d.reply;
  if(d.voice)m.voice={...d.voice,heard:prev&&prev.voice&&prev.voice.heard||d.from===RT.uid};
  Object.entries(d.reactions||{}).forEach(([e,arr])=>{if(Array.isArray(arr)&&arr.length)m.reactions[e]={n:arr.length,mine:arr.includes(RT.uid)}});
  if(d.poll){const votes=d.poll.votes||{};m.poll={q:d.poll.q,opts:(d.poll.opts||[]).map((t,i)=>({t,v:Object.values(votes).filter(v=>v===i).length})),voted:votes[RT.uid]!==undefined?votes[RT.uid]:-1}}
  return m;
}
function recomputeStatus(c){
  const others=Object.entries(c.reads||{}).filter(([u])=>u!==RT.uid).map(([,t])=>t);const maxRead=others.length?Math.max(...others):0;
  c.messages.forEach(m=>{if(m.from==='me'&&!m.sys&&m.status!=='scheduled'&&m.status!=='waiting')m.status=m.time<=maxRead?'read':'sent'});
  const mine=(c.reads||{})[RT.uid]||0;
  c.unread=T.openChat===c.id?0:c.messages.filter(m=>m.from!=='me'&&!m.sys&&m.time>mine).length;
}
function watchMessages(c,attempt){
  attempt=attempt||0;const F=FBX();const q=F.query(F.collection(F.db,'chats',c.rid,'messages'),F.orderBy('time','desc'),F.limit(150));
  RT.msgUnsubs[c.rid]=F.onSnapshot(q,snap=>{
    const hidden=new Set((S.hidden&&S.hidden[c.id])||[]);
    const list=snap.docs.map(d=>mapMsg(c,d)).filter(m=>!hidden.has(m.id)&&!(m.from!=='me'&&RT.blocked.includes(m.from)));
    list.sort((a,b)=>a.time-b.time);
    c.messages=list.concat(c.pending||[]);
    recomputeStatus(c);save();
    if(T.openChat===c.id){renderMessages();markRemoteRead(c)}
    renderListIfVisible();
  },e=>{ // the chat may not be on the server yet (just created): reconnect a few times instead of going silent
    delete RT.msgUnsubs[c.rid];
    if(attempt<8&&S.chats[c.id]&&RT.uid){setTimeout(()=>{if(!RT.msgUnsubs[c.rid]&&S.chats[c.id]&&RT.uid)watchMessages(S.chats[c.id],attempt+1)},700*(attempt+1));return}
    if(!(e&&e.code==='permission-denied'))toast(fbErr(e));
  });
}
function markRemoteRead(c){
  const F=FBX();const last=c.messages.filter(m=>m.from!=='me'&&!m.sys).pop();if(!last)return;
  if(((c.reads||{})[RT.uid]||0)>=last.time)return;
  c.reads=c.reads||{};c.reads[RT.uid]=Date.now();
  F.updateDoc(F.doc(F.db,'chats',c.rid),new F.FieldPath('reads',RT.uid),Date.now()).catch(()=>{});
}
function remoteTyping(c){const F=FBX();const t=Date.now();if(t-RT.typingSent<2500)return;RT.typingSent=t;F.updateDoc(F.doc(F.db,'chats',c.rid),new F.FieldPath('typing',RT.uid),t).catch(()=>{})}

/* ---------- writing ---------- */
function msgPayload(o){
  const d={from:RT.uid,time:Date.now(),text:o.text||''};
  if(o.spoiler)d.spoiler=true;if(o.img)d.img=o.img;if(o.sticker){if(o.sticker.startsWith('img:')){const im=S.stickers[+o.sticker.slice(4)];if(im)d.img=im}else d.sticker=o.sticker}
  if(o.fwd)d.fwd=o.fwd;if(o.voice)d.voice={src:o.voice.src,dur:o.voice.dur,wave:o.voice.wave};
  if(o.poll)d.poll={q:o.poll.q,opts:o.poll.opts.map(x=>x.t),votes:{}};
  if(o.reply)d.reply=o.reply;
  return d;
}
async function remoteWrite(c,d){
  const F=FBX();
  if(JSON.stringify(d).length>900000){toast('Слишком большой файл — до ~600 КБ');return false}
  if(c.type==='private'&&S.users[c.user]?.blocked){toast('Вы заблокировали этого пользователя');return false}
  const ref=F.doc(F.collection(F.db,'chats',c.rid,'messages'));T.justSent=ref.id;
  try{
    await F.setDoc(ref,d);
    const pv=d.voice?'🎤 Голосовое сообщение':d.poll?'📊 '+d.poll.q:d.img?'🖼 Фото':d.sticker?'Стикер':d.spoiler?'▒▒▒▒▒▒':(d.text||'').slice(0,120);
    F.updateDoc(F.doc(F.db,'chats',c.rid),{lastMsg:{text:pv,from:RT.uid,time:d.time},updatedAt:d.time,[`typing.${RT.uid}`]:0}).catch(()=>{});
    return true;
  }catch(e){toast(e&&e.code==='permission-denied'&&c.type==='private'?'Сообщение не доставлено: вас заблокировали':fbErr(e));return false}
}
function remoteSend(c,o,when){
  const d=msgPayload({...o,reply:T.reply||undefined});if(T.reply)clearReply();
  if(when){ // scheduled or "when online": kept on this device until it is time
    const m={id:'p'+uid(),from:'me',text:d.text,time:now(),status:typeof when==='number'?'scheduled':'waiting',reactions:{},payload:d};
    if(typeof when==='number')m.schedAt=when;if(d.img)m.img=d.img;if(d.voice)m.voice=d.voice;if(d.spoiler)m.spoiler=true;
    c.pending.push(m);c.messages.push(m);T.justSent=m.id;save();renderMessages();
    toast(typeof when==='number'?'Отправится в это время, если мессенджер будет открыт':'Отправится, когда собеседник будет в сети (мессенджер должен быть открыт)');return;
  }
  remoteWrite(c,d);
}
setInterval(()=>{Object.values(S.chats).forEach(c=>{if(!c.remote||!c.pending||!c.pending.length)return;
  c.pending.slice().forEach(p=>{const due=p.status==='scheduled'?p.schedAt<=now():(c.type==='private'&&S.users[c.user]?.online);
    if(due){c.pending=c.pending.filter(x=>x!==p);c.messages=c.messages.filter(x=>x!==p);save();remoteWrite(c,{...p.payload,time:Date.now()})}})})},4000);
function remoteReact(c,id,e){
  const F=FBX();const m=c.messages.find(x=>x.id===id);if(!m)return;const ref=F.doc(F.db,'chats',c.rid,'messages',id);
  const old=Object.entries(m.reactions||{}).find(([,v])=>v.mine);const args=[];
  if(old)args.push(new F.FieldPath('reactions',old[0]),F.arrayRemove(RT.uid));
  if(!old||old[0]!==e)args.push(new F.FieldPath('reactions',e),F.arrayUnion(RT.uid));
  if(args.length)F.updateDoc(ref,...args).catch(err=>toast(fbErr(err)));
}
function remoteVote(c,id,i){const F=FBX();F.updateDoc(F.doc(F.db,'chats',c.rid,'messages',id),new F.FieldPath('poll','votes',RT.uid),i).catch(e=>toast(fbErr(e)))}
function remoteDelete(c,id,all){
  if(String(id).startsWith('p')){c.pending=c.pending.filter(x=>x.id!==id);c.messages=c.messages.filter(x=>x.id!==id);save();renderMessages();return}
  if(all){const F=FBX();F.deleteDoc(F.doc(F.db,'chats',c.rid,'messages',id)).catch(e=>toast(e&&e.code==='permission-denied'?'Удалить у всех это сообщение может только автор или админ':fbErr(e)))}
  else{S.hidden=S.hidden||{};(S.hidden[c.id]=S.hidden[c.id]||[]).push(id);c.messages=c.messages.filter(x=>x.id!==id);save();renderMessages();renderListIfVisible()}
}
function remoteClear(c,all){
  if(!all){S.hidden=S.hidden||{};S.hidden[c.id]=(S.hidden[c.id]||[]).concat(c.messages.map(m=>m.id));return}
  const F=FBX();const b=F.writeBatch(F.db);c.messages.filter(m=>!String(m.id).startsWith('p')).slice(-400).forEach(m=>b.delete(F.doc(F.db,'chats',c.rid,'messages',m.id)));
  b.commit().catch(e=>toast(fbErr(e)));
}
async function openRemoteChatWith(otherUid){
  const F=FBX();const id=[RT.uid,otherUid].sort().join('_');const ref=F.doc(F.db,'chats',id);
  try{const s=await F.getDoc(ref).catch(()=>null);
    if(!s||!s.exists())await F.setDoc(ref,{type:'private',members:[RT.uid,otherUid].sort(),created:Date.now(),updatedAt:Date.now(),reads:{},typing:{}});
    applyChatDoc(id,{type:'private',members:[RT.uid,otherUid],reads:{},typing:{}});openChat('r_'+id);
  }catch(e){toast(fbErr(e))}
}
async function findByUsername(q){
  const F=FBX();const un=q.trim().replace(/^@/,'').toLowerCase();if(!/^[a-z0-9_]{3,32}$/.test(un))return null;
  try{const s=await F.getDoc(F.doc(F.db,'usernames',un));if(!s.exists())return null;const id=s.data().uid;if(id===RT.uid)return null;
    const u=await F.getDoc(F.doc(F.db,'users',id));return u.exists()?{id,...u.data()}:null}catch(_){return null}
}
function openFindUser(){
  openSheet('Найти человека',`<input class="fld" id="fuQ" placeholder="@имя пользователя" autocapitalize="off" autocorrect="off"><div id="fuRes" class="hint" style="margin:6px 4px">Попросите друга сказать его @ник — он есть в его Настройках.</div><button class="btn" id="fuGo">Найти</button>`,sh=>{
    const go=async()=>{const r=sh.querySelector('#fuRes');r.textContent='Ищем…';const u=await findByUsername(sh.querySelector('#fuQ').value);
      if(!u){r.textContent='Никого не нашли. Проверьте @ник.';return}
      r.innerHTML=`<div class="chk" style="cursor:pointer" id="fuHit">${avHTML({name:u.name,color:colorFor(u.id),img:u.avatar},44)}<div><div style="color:#fff;font-size:16px">${esc(u.name)}</div><div>@${esc(u.username)}</div></div><span class="link" style="margin-left:auto">Написать</span></div>`;
      r.querySelector('#fuHit').onclick=()=>{closePopups();setTimeout(()=>openRemoteChatWith(u.id),300)}};
    sh.querySelector('#fuGo').onclick=go;sh.querySelector('#fuQ').onkeydown=e=>{if(e.key==='Enter')go()};setTimeout(()=>sh.querySelector('#fuQ').focus(),350);
  });
}
async function createRemoteGroup(title,sel,av){
  const F=FBX();const t=Date.now();
  try{const ref=await F.addDoc(F.collection(F.db,'chats'),{type:'group',title,avatar:av||null,color:COLORS[Math.floor(Math.random()*8)],members:[RT.uid,...sel],admins:[RT.uid],created:t,updatedAt:t,reads:{},typing:{},lastMsg:{text:'Группа создана',from:RT.uid,time:t}});
    await F.setDoc(F.doc(F.collection(F.db,'chats',ref.id,'messages')),{from:RT.uid,sys:true,text:`${S.me.name} создал(а) группу «${title}»`,time:t});
    applyChatDoc(ref.id,{type:'group',title,members:[RT.uid,...sel],admins:[RT.uid],reads:{},typing:{}});setTimeout(()=>openChat('r_'+ref.id),200);
  }catch(e){toast(fbErr(e))}
}
function remoteMembers(c,addIds,removeId){
  const F=FBX();const ref=F.doc(F.db,'chats',c.rid);
  const p=addIds?F.updateDoc(ref,{members:F.arrayUnion(...addIds)}):F.updateDoc(ref,{members:F.arrayRemove(removeId)});
  p.then(()=>F.setDoc(F.doc(F.collection(F.db,'chats',c.rid,'messages')),{from:RT.uid,sys:true,text:addIds?`${S.me.name} добавил(а) ${addIds.map(i=>S.users[i]?.name||'участника').join(', ')}`:`${S.me.name} удалил(а) ${S.users[removeId]?.name||'участника'}`,time:Date.now()})).catch(e=>toast(fbErr(e)));
}
function remoteLeave(c){const F=FBX();F.updateDoc(F.doc(F.db,'chats',c.rid),{members:F.arrayRemove(RT.uid)}).catch(e=>toast(fbErr(e)))}
function remoteDeleteGroup(c){const F=FBX();F.deleteDoc(F.doc(F.db,'chats',c.rid)).catch(e=>toast(fbErr(e)))}
function remoteBlock(id,on){const F=FBX();F.updateDoc(F.doc(F.db,'users',RT.uid),{blocked:on?F.arrayUnion(id):F.arrayRemove(id)}).catch(e=>toast(fbErr(e)))}
function remoteReport(c,m){
  const F=FBX();actionSheet('Пожаловаться на сообщение?',[{label:'Спам',red:true,fn:()=>send('spam')},{label:'Оскорбления',red:true,fn:()=>send('abuse')},{label:'Неприемлемый контент',red:true,fn:()=>send('content')}]);
  function send(r){F.addDoc(F.collection(F.db,'reports'),{by:RT.uid,reason:r,chat:c.rid,msg:m.id,author:m.from==='me'?RT.uid:m.from,text:(m.text||'').slice(0,500),time:Date.now()}).then(()=>toast('Жалоба отправлена. Спасибо!')).catch(e=>toast(fbErr(e)))}
}
async function remoteSaveProfile(p){
  const F=FBX();
  try{
    if(p.username&&p.username!==RT.me.username){
      await F.runTransaction(F.db,async tx=>{const nr=F.doc(F.db,'usernames',p.username);const s=await tx.get(nr);if(s.exists()&&s.data().uid!==RT.uid)throw {code:'taken'};tx.delete(F.doc(F.db,'usernames',RT.me.username));tx.set(nr,{uid:RT.uid});tx.update(F.doc(F.db,'users',RT.uid),{username:p.username})});
    }
    await F.updateDoc(F.doc(F.db,'users',RT.uid),{name:p.name,bio:p.bio||'',avatar:p.avatar||null});
    toast('Сохранено');return true;
  }catch(e){toast(e&&e.code==='taken'?'Это имя пользователя занято':fbErr(e));return false}
}
async function remoteDeleteAccount(){
  const F=FBX();const u=F.auth.currentUser;if(!u)return;
  try{
    for(const c of Object.values(S.chats).filter(x=>x.remote&&x.type==='group'))await F.updateDoc(F.doc(F.db,'chats',c.rid),{members:F.arrayRemove(RT.uid)}).catch(()=>{});
    if(RT.me&&RT.me.username)await F.deleteDoc(F.doc(F.db,'usernames',RT.me.username)).catch(()=>{});
    await F.deleteDoc(F.doc(F.db,'users',RT.uid)).catch(()=>{});
    await F.deleteUser(u);toast('Аккаунт удалён');
  }catch(e){toast(e&&e.code==='auth/requires-recent-login'?'Для удаления войдите заново и повторите':fbErr(e));if(e&&e.code==='auth/requires-recent-login')F.signOut(F.auth)}
}

function onOwnSite(){return /^https?:$/.test(location.protocol)&&!/claude\.(ai|site)|claudeusercontent|anthropic/.test(location.hostname)}
function applyIcon(){
  const k=APPICONS[S.appIcon]?S.appIcon:'classic';const I=APPICONS[k];
  if(!onOwnSite())return;
  const set=(rel,href)=>{let l=document.querySelector(`link[rel="${rel}"]`);if(!l){l=document.createElement('link');l.rel=rel;document.head.appendChild(l)}l.href=href};
  set('apple-touch-icon',I.touch);set('icon',I.i192);
  try{const abs=u=>new URL(u,location.href).href;const man={name:'Мессенджер',short_name:'Мессенджер',start_url:abs('./'),scope:abs('./'),display:'standalone',background_color:'#000000',theme_color:'#000000',icons:[{src:abs(I.i192),sizes:'192x192',type:'image/png'},{src:abs(I.i512),sizes:'512x512',type:'image/png',purpose:'any maskable'}]};
    set('manifest',URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'})))}catch(_){}
}
function openIconPicker(){
  const cur=APPICONS[S.appIcon]?S.appIcon:'classic';
  openSheet('Иконка приложения',`<div class="icgrid">${Object.entries(APPICONS).map(([k,I],i)=>`<button class="ictile ${k===cur?'on':''}" data-ic="${k}" style="animation-delay:${i*70}ms"><img src="${I.prev}" alt=""><span>${I.n}</span></button>`).join('')}</div>
   <p class="hint" style="margin:14px 4px 0;line-height:1.45">На iPhone значок на экране «Домой» меняется так: удалите старый значок и добавьте снова — Safari → «Поделиться» → «На экран „Домой“». Новый значок будет с выбранной иконкой.</p>`,sh=>{
    sh.querySelectorAll('.ictile').forEach(b=>b.onclick=()=>{S.appIcon=b.dataset.ic;save();applyIcon();
      sh.querySelectorAll('.ictile').forEach(x=>x.classList.toggle('on',x===b));
      b.querySelector('img').animate([{transform:'scale(.8) rotate(-8deg)'},{transform:'scale(1.12) rotate(4deg)'},{transform:'none'}],{duration:480,easing:'cubic-bezier(.34,1.6,.64,1)'});
      if(b.dataset.ic==='galaxy'){const r=b.getBoundingClientRect(),ar=$('#app').getBoundingClientRect();burst('✨',r.left-ar.left+r.width/2,r.top-ar.top+r.height/2-14)}
      toast('Иконка: '+APPICONS[b.dataset.ic].n);renderSettings()});
  });
}
/* ================= POLLS ================= */
function pollHTML(m){
  const P=m.poll;const tot=P.opts.reduce((a,o)=>a+o.v,0);const voted=P.voted>=0;
  return `<div class="poll ${voted?'done':''}" data-poll="${m.id}"><div class="pq">${esc(P.q)}</div><div class="pk">Анонимный опрос</div>${P.opts.map((o,i)=>{const pc=tot?Math.round(o.v/tot*100):0;return `<button class="popt ${P.voted===i?'mine':''}" data-o="${i}"><span class="pbar" style="width:${voted?pc:0}%"></span><span class="pc">${voted?pc+'%':''}</span><span class="pr"></span><span class="pt">${esc(o.t)}</span>${P.voted===i?'<span class="pck">✓</span>':''}</button>`}).join('')}<div class="ptot">${tot?fmtK(tot)+' '+plural(tot,'голос','голоса','голосов'):'Пока никто не голосовал'}</div></div>`;
}
function votePoll(id,i){
  const m=findMsg(id);if(!m||!m.poll||m.poll.voted>=0)return;
  {const rc=S.chats[T.openChat];if(rc&&rc.remote){remoteVote(rc,id,i);return}}
  m.poll.voted=i;m.poll.opts[i].v++;save();renderMessages();
  requestAnimationFrame(()=>{const el=document.querySelector(`#msgs .poll[data-poll="${id}"]`);if(!el)return;
    el.querySelectorAll('.pbar').forEach((b,k)=>{const w=b.style.width;b.style.width='0%';b.animate([{width:'0%'},{width:w}],{duration:650,delay:k*60,easing:'cubic-bezier(.22,.9,.3,1)',fill:'forwards'}).onfinish=()=>{b.style.width=w}});
    const r=el.querySelector('.popt.mine')?.getBoundingClientRect(),ar=$('#app').getBoundingClientRect();if(r)burst('✨',r.left-ar.left+r.width-30,r.top-ar.top+r.height/2)});
}
function openPollCreator(){
  openSheet('Новый опрос',`<input class="fld" id="pQ" placeholder="Вопрос" maxlength="200"><div id="pOpts"><input class="fld popin" placeholder="Вариант 1" maxlength="80"><input class="fld popin" placeholder="Вариант 2" maxlength="80"></div><button class="btn ghost" id="pAdd">＋ Добавить вариант</button><button class="btn" id="pGo" style="margin-top:10px">Опубликовать опрос</button>`,sh=>{
    sh.querySelector('#pAdd').onclick=()=>{const box=sh.querySelector('#pOpts');const n=box.children.length;if(n>=8){toast('Максимум 8 вариантов');return}const i=document.createElement('input');i.className='fld popin';i.placeholder='Вариант '+(n+1);i.maxLength=80;box.appendChild(i);i.animate([{opacity:0,transform:'translateY(-8px)'},{opacity:1,transform:'none'}],{duration:240});i.focus()};
    sh.querySelector('#pGo').onclick=()=>{const q=sh.querySelector('#pQ').value.trim();const opts=[...sh.querySelectorAll('.popin')].map(x=>x.value.trim()).filter(Boolean);
      if(!q){toast('Напишите вопрос');return}if(opts.length<2){toast('Нужно минимум 2 варианта');return}
      closePopups();setTimeout(()=>sendMessage({text:q,poll:{q,opts:opts.map(t=>({t,v:0})),voted:-1}}),250)};

function loopCall(){
  if(!CALL)return;
  const t=performance.now()/1000;

    const ampR=talkRemote?Math.max(0,.35+n*.65):0.02;
    const ampM=!talkRemote&&!CALL.muted?Math.max(0,.3+Math.sin(t*13)*.4):0;
    const av=$('#clAv');if(av)av.style.setProperty('--amp',ampR.toFixed(3));

/* ---------- pull down the chat list → archive ---------- */
const PULL={on:false,y0:0,p:0,full:false,wheel:0,wt:0,justDragged:false};
function pullEligible(){return T.tab==='chats'&&!T.archive&&!T.q.trim()&&!T.openChat&&$('#mainContent').scrollTop<=0&&$('#pullZone')}
function pullSet(dy){
  const z=$('#pullZone'),w=$('#listwrap');if(!z||!w)return;
  const eff=dy<=0?0:Math.min(170,dy<120?dy*.62:74+(dy-120)*.25);
  PULL.p=Math.min(1,eff/88);
  w.style.transition=z.style.transition='none';
  w.style.transform=`translateY(${eff}px)`;z.style.height=eff+'px';z.style.opacity=Math.min(1,eff/26);
  const n=Math.round(PULL.p*16);z.querySelectorAll('.st').forEach((l,i)=>l.classList.toggle('on',i<n));
  z.querySelector('.pullring').style.transform=`rotate(${PULL.p*200-200}deg) scale(${.6+PULL.p*.4})`;
  if(PULL.p>=1&&!PULL.full){PULL.full=true;z.classList.add('full');z.querySelector('.pulltxt').textContent='Отпустите — откроется архив';try{navigator.vibrate&&navigator.vibrate(12)}catch(_){}
    z.querySelector('.pullring').animate([{filter:'brightness(1)'},{filter:'brightness(1.6)'},{filter:'brightness(1)'}],{duration:300})}
  else if(PULL.p<1&&PULL.full){PULL.full=false;z.classList.remove('full');z.querySelector('.pulltxt').textContent='Потяните вниз — архив'}
}
function pullEnd(){
  const z=$('#pullZone'),w=$('#listwrap');if(!z||!w)return;
  const go=PULL.full;PULL.full=false;PULL.p=0;
  const ease='cubic-bezier(.32,.72,0,1)';
  w.style.transition=`transform .5s ${ease}`;z.style.transition=`height .5s ${ease},opacity .35s`;
  if(go){
    z.classList.add('go');
    w.style.transform='translateY(100%)';w.style.opacity='0';w.style.transition+=',opacity .4s';
    setTimeout(()=>{T.archive=true;renderMain();const p=$('#mainContent .archpane');p&&p.animate([{transform:'translateY(-60px) scale(.97)',opacity:0},{transform:'none',opacity:1}],{duration:520,easing:'cubic-bezier(.34,1.2,.64,1)'})},300);
  }else{w.style.transform='';z.style.height='0px';z.style.opacity='0'}
}
(function(){
  const ct=$('#mainContent');
  ct.addEventListener('touchstart',e=>{PULL.on=!!pullEligible();PULL.y0=e.touches[0].clientY;PULL.moved=false},{passive:true});
  ct.addEventListener('touchmove',e=>{if(!PULL.on)return;const dy=e.touches[0].clientY-PULL.y0;if(dy>0&&ct.scrollTop<=0){e.preventDefault();PULL.moved=true;pullSet(dy)}else if(dy<0&&!PULL.moved)PULL.on=false},{passive:false});
  ct.addEventListener('touchend',()=>{if(PULL.on&&PULL.moved)pullEnd();PULL.on=false});
  // mouse drag
  let md=null;

  window.addEventListener('pointermove',e=>{if(!md)return;const dy=e.clientY-md.y;if(dy>6){md.moved=true;pullSet(dy)}});

})();

function randomIncoming(){
  if(CALL||document.querySelector('.passcode'))return;
  const cand=Object.entries(S.users).filter(([id,u])=>u.contact&&!u.blocked&&u.online&&!S.chats['p_'+id]?.locked);
  if(!cand.length)return;const [id]=cand[Math.floor(Math.random()*cand.length)];
  startCall(ensurePrivate(id),Math.random()<.3,true,null);
}
if(DEMO){setTimeout(randomIncoming,75000);setInterval(()=>{if(Math.random()<.25)randomIncoming()},300000)}

/* ---------- swipe from the left edge to go back ---------- */
(function(){
  const ch=$('#chat'),mn=$('#main');let st=null;
  ch.addEventListener('pointerdown',e=>{if(!ch.classList.contains('open'))return;const ar=$('#app').getBoundingClientRect();if(e.clientX-ar.left>28)return;st={x:e.clientX,y:e.clientY,w:ar.width,dx:0,on:false,id:e.pointerId,t:performance.now()}});
  ch.addEventListener('pointermove',e=>{if(!st)return;const dx=e.clientX-st.x;
    if(!st.on){if(Math.abs(e.clientY-st.y)>14){st=null;return}if(dx<8)return;st.on=true;try{ch.setPointerCapture(st.id)}catch(_){}ch.style.transition=mn.style.transition='none'}
    st.dx=Math.max(0,dx);const p=st.dx/st.w;st.v=(st.dx)/(performance.now()-st.t);
    ch.style.transform=`translateX(${st.dx}px)`;mn.style.transform=`translateX(${-25+25*p}%)`;mn.style.opacity=.6+.4*p});
  const end=()=>{if(!st)return;const s=st;st=null;if(!s.on)return;
    const close=s.dx>s.w*.33||(s.v||0)>.55;
    ch.style.transition=mn.style.transition='';void ch.offsetWidth;
    ch.style.transform=mn.style.transform=mn.style.opacity='';if(close)closeChat()};
  ch.addEventListener('pointerup',end);ch.addEventListener('pointercancel',end);
})();

document.body.classList.toggle('noanim',!S.animEmoji);
applyIcon();
if(REAL){showAuthLoading();const go=()=>startRemote();if(window.FB)go();else window.addEventListener('fb-ready',go,{once:true});setTimeout(()=>{if(!window.FB)showAuthErrorBox()},20000)}
ensureFeeds();feedTick(true);setInterval(()=>feedTick(false),30000);setInterval(botTick,4000);setInterval(banterTick,9000);
$('#app').addEventListener('scroll',e=>{e.currentTarget.scrollLeft=0;e.currentTarget.scrollTop=0});
renderMain();

if(DEMO)setTimeout(()=>{const c=S.chats.p_u1;if(c&&S.users.u1.online&&!T.typing[c.id])scheduleReply(c,'u1')},6000);
})();
