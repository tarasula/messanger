function setCallStatus(t){const s=$('#clSt');if(!s)return;if(s.textContent===t)return;s.textContent=t;s.animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:260,easing:'ease-out'})}
function ctrlBtn(id,icon,label,on,cls){return `<div class="cb"><button id="${id}" class="${on?'on':''} ${cls||''}">${icon}</button><span>${label}</span></div>`}
function paintCtrls(){
  const el=$('#clCtrls');if(!el||!CALL)return;
  if(CALL.st==='incoming'){
    el.className='cl-ctrls inc';
    el.innerHTML=`${ctrlBtn('clDecl',CI.end,'Отклонить',false,'red')}<div class="cb"><button id="clMsg" class="small">💬</button><span>Сообщение</span></div>${ctrlBtn('clAcc',CI.accept,'Принять',false,'green pulse')}`;
    $('#clDecl').onclick=()=>endCall('declined');
    $('#clAcc').onclick=()=>{actx();if(CALL.real)acceptRealCall();else connectCall()};
    $('#clMsg').onclick=quickReplyCall;
    return;
  }
  el.className='cl-ctrls';
  el.innerHTML=`${ctrlBtn('clSpk',CI.spk,'Динамик',CALL.speaker)}${ctrlBtn('clCam',CI.cam,'Видео',CALL.video)}${ctrlBtn('clMic',CALL.muted?CI.micOff:CI.mic,CALL.muted?'Звук выкл.':'Микрофон',CALL.muted)}${ctrlBtn('clEnd',CI.end,'Завершить',false,'red')}`;
  const pop=b=>b.animate([{transform:'scale(.82)'},{transform:'scale(1.08)'},{transform:'none'}],{duration:340,easing:'cubic-bezier(.34,1.5,.64,1)'});
  $('#clSpk').onclick=e=>{CALL.speaker=!CALL.speaker;paintCtrls();pop($('#clSpk'));toast(CALL.speaker?'Громкая связь':'Динамик телефона')};
  $('#clMic').onclick=()=>{CALL.muted=!CALL.muted;realMute();paintCtrls();pop($('#clMic'))};
  $('#clCam').onclick=()=>{if(CALL.real)realCam();else toggleVideo()};
  $('#clEnd').onclick=()=>endCall(CALL.st==='active'?'ok':'cancelled');

function quickReplyCall(){
  const opts=['Не могу говорить, перезвоню 🙏','Напишу позже','Я за рулём 🚗','Перезвоню через 5 минут'];
  const box=document.createElement('div');box.className='cl-qr';box.innerHTML=opts.map(o=>`<button>${esc(o)}</button>`).join('');
  $('#callUI').appendChild(box);
  box.onclick=e=>{const b=e.target.closest('button');if(!b)return;const c=S.chats[CALL.cid];const txt=b.textContent;endCall('declined');c.messages.push({id:uid(),from:'me',text:txt,time:now()+10,status:'sent',reactions:{}});save();if(T.openChat===c.id)renderMessages();renderListIfVisible();toast('Сообщение отправлено')};
}
function toggleVideo(){
  CALL.video=!CALL.video;const ui=$('#callUI');ui.classList.toggle('vid',CALL.video);paintCtrls();
  const self=$('#clSelf');
  if(CALL.video){
    self.animate([{transform:'scale(.3)',opacity:0},{transform:'none',opacity:1}],{duration:420,easing:'cubic-bezier(.34,1.5,.64,1)'});
    try{
      navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false}).then(st=>{if(!CALL||!CALL.video){st.getTracks().forEach(t=>t.stop());return}CALL.stream=st;const v=document.createElement('video');v.autoplay=true;v.muted=true;v.playsInline=true;v.srcObject=st;self.innerHTML='';self.appendChild(v)}).catch(()=>toast('Камера недоступна в этом окне — показываем аватар'));
    }catch(_){toast('Камера недоступна в этом окне')}
  }else if(CALL.stream){CALL.stream.getTracks().forEach(t=>t.stop());CALL.stream=null;self.innerHTML=avHTML({name:S.me.name,color:S.me.color,img:S.me.avatar},54)}
}
function initSelfDrag(){
  const s=$('#clSelf');let st=null;
  s.addEventListener('pointerdown',e=>{const r=s.getBoundingClientRect();st={dx:e.clientX-r.left,dy:e.clientY-r.top};s.setPointerCapture(e.pointerId);s.style.transition='none'});
  s.addEventListener('pointermove',e=>{if(!st)return;const ar=$('#callUI').getBoundingClientRect();s.style.left=(e.clientX-ar.left-st.dx)+'px';s.style.top=(e.clientY-ar.top-st.dy)+'px';s.style.right='auto'});
  s.addEventListener('pointerup',()=>{if(!st)return;st=null;const ar=$('#callUI').getBoundingClientRect(),r=s.getBoundingClientRect();
    const left=(r.left+r.width/2-ar.left)<ar.width/2,topH=(r.top+r.height/2-ar.top)<ar.height/2;
    s.style.transition='left .5s cubic-bezier(.34,1.4,.64,1),top .5s cubic-bezier(.34,1.4,.64,1)';
    s.style.left=(left?14:ar.width-r.width-14)+'px';s.style.top=(topH?70:ar.height-r.height-150)+'px'});
}
function connectCall(){
  if(!CALL)return;
  CALL.st='active';CALL.t0=now();stopTones();tone([660],.09,.06);tone([990],.12,.06,.1);
  paintCtrls();setCallStatus('0:00');
  $('#callUI').classList.add('active');
  const k=$('#clKey');k.innerHTML=CALL.key.map((e,i)=>`<span style="animation-delay:${.15+i*.09}s">${e}</span>`).join('');
  const enc=$('#clEnc');enc.textContent='🔒 '+CALL.key.join('');
  if(CALL.group){const c=S.chats[CALL.cid];const tiles=$('#clTiles');tiles.innerHTML=`<div class="tile me" data-t="me">${avHTML({name:S.me.name,color:S.me.color,img:S.me.avatar},62)}<span>Вы</span></div>`;
    c.members.forEach((m,i)=>CALL.timers.push(setTimeout(()=>{if(!CALL)return;const u=S.users[m];const d=document.createElement('div');d.className='tile';d.dataset.t=m;d.innerHTML=`${avHTML({name:u.name,color:u.color,emoji:u.emoji,img:u.avatar},62)}<span>${esc(u.name.split(' ')[0])}</span>`;tiles.appendChild(d);d.animate([{transform:'scale(.3)',opacity:0},{transform:'scale(1.06)',opacity:1,offset:.7},{transform:'none'}],{duration:480,easing:'cubic-bezier(.34,1.4,.64,1)'});CALL.joined.push(m);tone([880],.06,.04)},600+i*900+Math.random()*500)));
    $('#callUI').classList.add('gcall')}
  CALL.timers.push(setInterval(()=>{if(!CALL||CALL.st!=='active')return;const d=fmtDur((now()-CALL.t0)/1000);setCallStatus(d);const mb=$('#callbar .cbt');if(mb)mb.textContent=d},1000));
}
function loopCall(){
  if(!CALL)return;
  const t=performance.now()/1000;
  if(CALL.st==='active'){
    // remote "speaks" in bursts; you speak in between
    const seg=Math.floor(t/2.6),talkRemote=(Math.sin(seg*12.9898)*43758.5453%1+1)%1>.4;
    const n=(Math.sin(t*11)+Math.sin(t*17.3)+Math.sin(t*5.1))/3;
    const ampR=talkRemote?Math.max(0,.35+n*.65):0.02;
    const ampM=!talkRemote&&!CALL.muted?Math.max(0,.3+Math.sin(t*13)*.4):0;
    const av=$('#clAv');if(av)av.style.setProperty('--amp',ampR.toFixed(3));
    document.querySelectorAll('#clTiles .tile').forEach((tl,i)=>{const a=tl.dataset.t==='me'?ampM:Math.max(0,Math.sin(t*(3+i)+i*2)*.9-.2);tl.style.setProperty('--amp',a.toFixed(3));tl.classList.toggle('spk',a>.35)});
    const self=$('#clSelf');if(self)self.style.setProperty('--amp',ampM.toFixed(3));
  }
  CALL.raf=requestAnimationFrame(loopCall);
}
function minimizeCall(){
  if(!CALL)return;CALL.min=true;const ui=$('#callUI');
  ui.animate([{transform:'none',borderRadius:'0px',opacity:1},{transform:'translateY(-46%) scale(.2,.06)',borderRadius:'40px',opacity:0}],{duration:440,easing:'cubic-bezier(.32,.72,0,1)'}).onfinish=()=>{if(CALL&&CALL.min)ui.style.display='none'};
  const bar=document.createElement('div');bar.id='callbar';bar.className='callbar';
  bar.innerHTML=`<span class="cbdot"></span>${esc(callTarget().name)} · <span class="cbt">${CALL.st==='active'?fmtDur((now()-CALL.t0)/1000):'вызов…'}</span><span class="cbr">Вернуться</span>`;
  $('#app').appendChild(bar);bar.animate([{transform:'translateY(-100%)'},{transform:'none'}],{duration:380,easing:'cubic-bezier(.34,1.3,.64,1)'});
  bar.onclick=restoreCall;
}
function restoreCall(){
  if(!CALL)return;CALL.min=false;const ui=$('#callUI');ui.style.display='';
  ui.animate([{transform:'translateY(-46%) scale(.2,.06)',borderRadius:'40px',opacity:0},{transform:'none',borderRadius:'0px',opacity:1}],{duration:480,easing:'cubic-bezier(.32,.72,0,1)'});
  const bar=$('#callbar');if(bar){bar.animate([{transform:'none'},{transform:'translateY(-100%)'}],{duration:260}).onfinish=()=>bar.remove()}
}
function endCall(res){
  if(!CALL||CALL.st==='ended')return;
  const K=CALL;const dur=K.st==='active'?(now()-K.t0)/1000:0;
  K.st='ended';stopTones();K.timers.forEach(x=>{clearTimeout(x);clearInterval(x)});
  if(K.stream)K.stream.getTracks().forEach(t=>t.stop());
  if(K.real)realCallCleanup(K,res==='ok'?'ok':res,dur);
  [0,.32,.64].forEach(d=>tone([480,620],.18,.05,d));
  const labels={ok:'Звонок завершён',cancelled:'Звонок отменён',missed:K.dir==='out'?'Нет ответа':'Пропущенный звонок',declined:K.dir==='out'?'Абонент занят':'Звонок отклонён'};
  setCallStatus(labels[res]+(dur?' · '+fmtDur(dur):''));
  const ui=$('#callUI');
  if(ui){ui.classList.add('ending');const ctr=$('#clCtrls');ctr&&ctr.animate([{opacity:1},{opacity:0,transform:'translateY(30px)'}],{duration:300,fill:'forwards'})}
  // record
  const c=S.chats[K.cid];
  if(c){
    const mres=res==='ok'?'ok':res;
    const missedIn=K.dir==='in'&&(res==='missed'||res==='declined');
    if(!K.real)c.messages.push({id:uid(),from:K.dir==='out'?'me':(c.type==='private'?c.user:'me'),text:'',time:now(),status:'read',reactions:{},call:{video:K.video,dur:Math.round(dur),res:mres}});
    S.calls=S.calls||[];S.calls.unshift({id:uid(),cid:K.cid,dir:K.dir,video:K.video,dur:Math.round(dur),res:mres,time:now()});S.calls=S.calls.slice(0,80);
    if(missedIn&&res==='missed'){S.missedNew=(S.missedNew||0)+1;if(T.openChat!==c.id)c.unread=(c.unread||0)+1}
    save();if(T.openChat===c.id)renderMessages();
  }
  setTimeout(()=>{
    cancelAnimationFrame(K.raf);
    const bar=$('#callbar');bar&&bar.remove();
    if(ui){if(ui.style.display==='none')ui.remove();else ui.animate([{opacity:1,transform:'none'},{opacity:0,transform:'scale(1.08)'}],{duration:380,easing:'ease-in'}).onfinish=()=>ui.remove()}
    CALL=null;renderTabbar();if(T.tab==='calls'&&!T.openChat)renderCalls();renderListIfVisible();
  },1400);
}

/* ---------- pull down the chat list → archive ---------- */
const PULL={on:false,y0:0,p:0,full:false,wheel:0,wt:0,justDragged:false};
function pullEligible(){return T.tab==='chats'&&!T.archive&&!T.q.trim()&&!T.openChat&&$('#mainContent').scrollTop<=0&&$('#pullZone')}
function pullSet(dy){
  const z=$('#pullZone'),w=$('#listwrap');if(!z||!w)return;
  const eff=dy<=0?0:Math.min(170,dy<120?dy*.62:74+(dy-120)*.25);
  PULL.p=Math.min(1,eff/88);
  w.style.transition=z.style.transition='none';
  w.style.transform=`translateY(${eff}px)`;z.style.height=eff+'px';z.style.opacity=Math.min(1,eff/26);
  const n=Math.round(PULL.p*16);z.querySelectorAll('.st').forEach((l,i)=>l.classList.toggle('on',i<n));
  z.querySelector('.pullring').style.transform=`rotate(${PULL.p*200-200}deg) scale(${.6+PULL.p*.4})`;
  if(PULL.p>=1&&!PULL.full){PULL.full=true;z.classList.add('full');z.querySelector('.pulltxt').textContent='Отпустите — откроется архив';try{navigator.vibrate&&navigator.vibrate(12)}catch(_){}
    z.querySelector('.pullring').animate([{filter:'brightness(1)'},{filter:'brightness(1.6)'},{filter:'brightness(1)'}],{duration:300})}
  else if(PULL.p<1&&PULL.full){PULL.full=false;z.classList.remove('full');z.querySelector('.pulltxt').textContent='Потяните вниз — архив'}
}
function pullEnd(){
  const z=$('#pullZone'),w=$('#listwrap');if(!z||!w)return;
  const go=PULL.full;PULL.full=false;PULL.p=0;
  const ease='cubic-bezier(.32,.72,0,1)';
  w.style.transition=`transform .5s ${ease}`;z.style.transition=`height .5s ${ease},opacity .35s`;
  if(go){
    z.classList.add('go');
    w.style.transform='translateY(100%)';w.style.opacity='0';w.style.transition+=',opacity .4s';
    setTimeout(()=>{T.archive=true;renderMain();const p=$('#mainContent .archpane');p&&p.animate([{transform:'translateY(-60px) scale(.97)',opacity:0},{transform:'none',opacity:1}],{duration:520,easing:'cubic-bezier(.34,1.2,.64,1)'})},300);
  }else{w.style.transform='';z.style.height='0px';z.style.opacity='0'}
}
(function(){
  const ct=$('#mainContent');
  ct.addEventListener('touchstart',e=>{PULL.on=!!pullEligible();PULL.y0=e.touches[0].clientY;PULL.moved=false},{passive:true});
  ct.addEventListener('touchmove',e=>{if(!PULL.on)return;const dy=e.touches[0].clientY-PULL.y0;if(dy>0&&ct.scrollTop<=0){e.preventDefault();PULL.moved=true;pullSet(dy)}else if(dy<0&&!PULL.moved)PULL.on=false},{passive:false});
  ct.addEventListener('touchend',()=>{if(PULL.on&&PULL.moved)pullEnd();PULL.on=false});
  // mouse drag
  let md=null;
  ct.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0||!pullEligible())return;md={y:e.clientY,moved:false}});
  window.addEventListener('pointermove',e=>{if(!md)return;const dy=e.clientY-md.y;if(dy>6){md.moved=true;pullSet(dy)}});
  window.addEventListener('pointerup',()=>{if(!md)return;if(md.moved){PULL.justDragged=true;setTimeout(()=>PULL.justDragged=false,60);pullEnd()}md=null});
  ct.addEventListener('click',e=>{if(PULL.justDragged){e.stopPropagation();e.preventDefault()}},true);
  // trackpad / wheel
  ct.addEventListener('wheel',e=>{if(!pullEligible())return;if(e.deltaY<0||PULL.wheel>0){e.preventDefault();PULL.wheel=Math.max(0,PULL.wheel-e.deltaY*1.3);pullSet(PULL.wheel);clearTimeout(PULL.wt);PULL.wt=setTimeout(()=>{PULL.wheel=0;pullEnd()},280)}},{passive:false});
})();

/* ---------- message gestures (delegated): hold → menu, swipe left → reply, double tap → ❤️ ---------- */
(function(){
  const box=$('#msgs');let t,fired=false,sx=0,sy=0,held=null,sw=null,swDone=false,lastTap={id:null,t:0};
  const unhold=()=>{clearTimeout(t);if(held){held.classList.remove('hold');held=null}};
  box.addEventListener('pointerdown',e=>{if(e.button===2)return;const b=e.target.closest('.bubble');if(!b||b.closest('.typing'))return;
    const row=b.closest('.row');if(!row||!row.dataset.id)return;
    fired=false;sx=e.clientX;sy=e.clientY;held=b;b.classList.add('hold');sw={row,id:row.dataset.id,on:false,pid:e.pointerId,armed:false};
    t=setTimeout(()=>{if(sw&&sw.on)return;fired=true;unhold();sw=null;if(navigator.vibrate)try{navigator.vibrate(10)}catch(_){}openMsgMenu(row.dataset.id,row)},420)});
  box.addEventListener('pointermove',e=>{
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(held&&(Math.abs(dx)>8||Math.abs(dy)>8))unhold();
    if(!sw)return;
    if(!sw.on){
      const ch=S.chats[T.openChat];const infoOk=sw.row.classList.contains('out')&&ch&&ch.type==='private';
      if(dx<-10&&Math.abs(dx)>Math.abs(dy)*1.3){sw.on=true;try{box.setPointerCapture(sw.pid)}catch(_){}
        const a=document.createElement('div');a.className='swarrow';a.innerHTML=IC.reply;sw.row.appendChild(a);sw.arrow=a}
      else if(infoOk&&dx>10&&Math.abs(dx)>Math.abs(dy)*1.3){sw.on=true;sw.info=true;try{box.setPointerCapture(sw.pid)}catch(_){}
        const a=document.createElement('div');a.className='swarrow swinfo';a.innerHTML='<span>ⓘ</span>';sw.row.appendChild(a);sw.arrow=a}
      else if(Math.abs(dy)>10||dx>10){sw=null}
      return;
    }
    const d=sw.info?Math.max(0,dx):Math.min(0,dx);const eff=sw.info?(d<64?d:64+(d-64)*.3):(d>-64?d:-64+(d+64)*.3);
    sw.row.style.transform=`translateX(${eff}px)`;
    const p=Math.min(1,Math.abs(eff)/56);sw.arrow.style.opacity=p;sw.arrow.style.transform=`translateY(-50%) scale(${.4+p*.6}) rotate(${(1-p)*-90}deg)`;
    if(p>=1&&!sw.armed){sw.armed=true;sw.arrow.classList.add('armed');try{navigator.vibrate&&navigator.vibrate(8)}catch(_){}sw.arrow.animate([{scale:'1'},{scale:'1.35'},{scale:'1'}],{duration:260,easing:'cubic-bezier(.34,1.6,.64,1)'})}
    else if(p<1&&sw.armed){sw.armed=false;sw.arrow.classList.remove('armed')}
  });
  const end=()=>{unhold();if(!sw)return;const s=sw;sw=null;if(!s.on)return;swDone=true;setTimeout(()=>swDone=false,80);
    const cur=s.row.style.transform;s.row.style.transform='';
    s.row.animate([{transform:cur},{transform:'translateX(6px)',offset:.7},{transform:'none'}],{duration:420,easing:'cubic-bezier(.34,1.3,.64,1)'});
    s.arrow.animate([{opacity:s.arrow.style.opacity||1},{opacity:0}],{duration:200,fill:'forwards'}).onfinish=()=>s.arrow.remove();
    if(s.armed){const m=findMsg(s.id);if(m){if(s.info)openMsgInfo(m);else setReply(m)}}};
  box.addEventListener('pointerup',end);box.addEventListener('pointercancel',end);box.addEventListener('pointerleave',()=>{if(!sw||!sw.on)unhold()});
  box.addEventListener('contextmenu',e=>{const b=e.target.closest('.bubble');if(!b||b.closest('.typing'))return;e.preventDefault();unhold();sw=null;if(!fired){const row=b.closest('.row');openMsgMenu(row.dataset.id,row)}fired=false});
  box.addEventListener('click',e=>{
    if(fired){fired=false;return}if(swDone)return;
    const row=e.target.closest('.row');if(!row||!row.dataset.id)return;
    const q=e.target.closest('.quote');if(q){jumpTo(q.dataset.q);return}
    const sp=e.target.closest('.spoiler');if(sp&&!sp.classList.contains('rev')){sp.classList.add('rev');T.revealed.add(sp.dataset.sp);return}
    const rc=e.target.closest('.rc');if(rc){toggleReaction(row.dataset.id,rc.dataset.r);return}
    const po=e.target.closest('.popt');if(po){votePoll(row.dataset.id,+po.dataset.o);return}
    const vp=e.target.closest('.vplay');if(vp){toggleVoice(row.dataset.id);return}
    const vs=e.target.closest('.vspd');if(vs){cycleSpeed(vs);return}
    const vw=e.target.closest('.vwave');if(vw){const r=vw.getBoundingClientRect();seekVoice(row.dataset.id,Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)));return}
    const cb=e.target.closest('.callb');if(cb){startCall(T.openChat,cb.dataset.call==='v',false,cb);return}
    const c=S.chats[T.openChat];
    if(c&&c.type==='group'&&e.target.closest('.who,.mav')&&S.users[row.dataset.from]){openUserProfile(row.dataset.from);return}
    const nowT=performance.now();
    if(lastTap.id===row.dataset.id&&nowT-lastTap.t<320){lastTap.id=null;const m=findMsg(row.dataset.id);if(m&&!(m.reactions&&m.reactions['❤️']&&m.reactions['❤️'].mine))toggleReaction(row.dataset.id,'❤️');return}
    lastTap={id:row.dataset.id,t:nowT};
  });
  box.addEventListener('scroll',()=>updateJump(),{passive:true});
  $('#jumpBtn').onclick=()=>{T.newBelow=0;scrollBottom();setTimeout(updateJump,400)};
})();
/* ---------- incoming calls now and then ---------- */
function randomIncoming(){
  if(CALL||document.querySelector('.passcode'))return;
  const cand=Object.entries(S.users).filter(([id,u])=>u.contact&&!u.blocked&&u.online&&!S.chats['p_'+id]?.locked);
  if(!cand.length)return;const [id]=cand[Math.floor(Math.random()*cand.length)];
  startCall(ensurePrivate(id),Math.random()<.3,true,null);
}
if(DEMO){setTimeout(randomIncoming,75000);setInterval(()=>{if(Math.random()<.25)randomIncoming()},300000)}

/* ---------- swipe from the left edge to go back ---------- */
(function(){
  const ch=$('#chat'),mn=$('#main');let st=null;
  ch.addEventListener('pointerdown',e=>{if(!ch.classList.contains('open'))return;const ar=$('#app').getBoundingClientRect();if(e.clientX-ar.left>28)return;st={x:e.clientX,y:e.clientY,w:ar.width,dx:0,on:false,id:e.pointerId,t:performance.now()}});
  ch.addEventListener('pointermove',e=>{if(!st)return;const dx=e.clientX-st.x;
    if(!st.on){if(Math.abs(e.clientY-st.y)>14){st=null;return}if(dx<8)return;st.on=true;try{ch.setPointerCapture(st.id)}catch(_){}ch.style.transition=mn.style.transition='none'}
    st.dx=Math.max(0,dx);const p=st.dx/st.w;st.v=(st.dx)/(performance.now()-st.t);
    ch.style.transform=`translateX(${st.dx}px)`;mn.style.transform=`translateX(${-25+25*p}%)`;mn.style.opacity=.6+.4*p});
  const end=()=>{if(!st)return;const s=st;st=null;if(!s.on)return;
    const close=s.dx>s.w*.33||(s.v||0)>.55;
    ch.style.transition=mn.style.transition='';void ch.offsetWidth;
    ch.style.transform=mn.style.transform=mn.style.opacity='';if(close)closeChat()};
  ch.addEventListener('pointerup',end);ch.addEventListener('pointercancel',end);
})();

document.body.classList.toggle('noanim',!S.animEmoji);
applyIcon();
if(REAL){showAuthLoading();const go=()=>startRemote();if(window.FB)go();else window.addEventListener('fb-ready',go,{once:true});setTimeout(()=>{if(!window.FB)showAuthErrorBox()},20000)}
ensureExtras();preloadMusic();ensureFeeds();feedTick(true);setInterval(()=>feedTick(false),30000);setInterval(botTick,2500);setInterval(banterTick,9000);
$('#app').addEventListener('scroll',e=>{e.currentTarget.scrollLeft=0;e.currentTarget.scrollTop=0});
renderMain();
// demo: Anna types after a moment
if(DEMO)setTimeout(()=>{const c=S.chats.p_u1;if(c&&S.users.u1.online&&!T.typing[c.id])scheduleReply(c,'u1')},6000);
})();
</script>
<script>try{if('serviceWorker' in navigator){let had=!!navigator.serviceWorker.controller,rl=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!rl){rl=true;location.reload()}});addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update();setInterval(()=>r.update(),30*60000)}).catch(()=>{}))}}catch(_){}</script>
